<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KioscoPOS - Lo De Billi (Persistente)</title>
    
    <!-- React y ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Fuente Inter (Google Fonts) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        slate: {
                            850: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        },
                        primary: {
                            500: '#3b82f6',
                            600: '#2563eb',
                        }
                    },
                    animation: {
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            -webkit-font-smoothing: antialiased; 
            -moz-osx-font-smoothing: grayscale;
            font-size: 14px;
        }
        
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.9);
        }

        .barcode-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2); }
        
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .critical-stock { animation: pulse-red 2s infinite; }
        .toggle-checkbox:checked { right: 0; border-color: #10B981; }
        .toggle-checkbox:checked + .toggle-label { background-color: #10B981; }

        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        .dark ::-webkit-scrollbar-thumb:hover { background: #475569; }

        @media print {
            body * { visibility: hidden; }
            #ticket-modal, #ticket-modal * { visibility: visible; }
            #ticket-modal {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 0;
                background: white;
                color: black;
                box-shadow: none;
                border: none;
            }
            .no-print { display: none !important; }
        }

        .calculator-shadow { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .cursor-grab { cursor: grab; }
        .cursor-grabbing { cursor: grabbing; }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 transition-colors duration-500 overflow-hidden">
    <div id="root" class="h-screen w-screen"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;
        
        // --- UTILIDAD DE SONIDO ---
        const playSound = (type) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                
                const ctx = new AudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'beep') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.1);
                } else if (type === 'cash') {
                    const now = ctx.currentTime;
                    const osc1 = ctx.createOscillator();
                    const gain1 = ctx.createGain();
                    osc1.connect(gain1);
                    gain1.connect(ctx.destination);
                    osc1.frequency.value = 987.77; // B5
                    gain1.gain.setValueAtTime(0.1, now);
                    gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                    osc1.start(now);
                    osc1.stop(now + 0.3);

                    const osc2 = ctx.createOscillator();
                    const gain2 = ctx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(ctx.destination);
                    osc2.frequency.value = 1318.51; // E6
                    gain2.gain.setValueAtTime(0.1, now + 0.1);
                    gain2.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                    osc2.start(now + 0.1);
                    osc2.stop(now + 0.4);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.value = 150;
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.2);
                }
            } catch (e) {
                console.error("Error de audio:", e);
            }
        };

        const generateUniqueId = () => {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        };

        const PRODUCTOS_INICIALES = [];
        const CATEGORIAS = ["Varios", "Bebidas", "Comestibles", "Golosinas", "Cigarrillos", "Limpieza", "Perfumería", "Lácteos", "Fiambrería", "Kiosco", "Promos"];

        const USUARIOS = [
            { id: 1, nombre: "CAROLA (ADMIN)", alias: "CAROLA", rol: "admin", pin: "1983" },
            { id: 2, nombre: "VENDEDOR (OSO POLAR)", alias: "OSO POLAR 🐻‍❄️", rol: "vendedor", pin: "1234" },
            { id: 3, nombre: "VENDEDOR (OSO PANDA)", alias: "OSO PANDA 🐼", rol: "vendedor", pin: "5678" }
        ];

        // --- HELPER PARA STOCK ---
        const calculateComboStock = (product, allProducts) => {
            if (!product.es_combo || !product.componentes || product.componentes.length === 0) return product.stock;
            
            let minStock = Infinity;
            product.componentes.forEach(comp => {
                const realProduct = allProducts.find(p => p.id === comp.id);
                if (realProduct) {
                    const possible = Math.floor(realProduct.stock / comp.cantidad);
                    if (possible < minStock) minStock = possible;
                } else {
                    minStock = 0;
                }
            });
            return minStock === Infinity ? 0 : minStock;
        };

        // --- COMPONENTE: CALCULADORA ---
        const Calculator = ({ isOpen }) => {
            const [display, setDisplay] = useState("0");
            const [equation, setEquation] = useState("");
            const [isNewNumber, setIsNewNumber] = useState(true);

            const handleNumber = useCallback((num) => {
                setDisplay(prev => isNewNumber ? num.toString() : (prev === "0" ? num.toString() : prev + num));
                setIsNewNumber(false);
            }, [isNewNumber]);

            const handleOperator = useCallback((op) => {
                setEquation(display + " " + op + " ");
                setIsNewNumber(true);
            }, [display]);

            const handleClear = useCallback(() => {
                setDisplay("0");
                setEquation("");
                setIsNewNumber(true);
            }, []);

            const handleEqual = useCallback(() => {
                try {
                    // eslint-disable-next-line no-eval
                    const result = eval(equation + display);
                    const formatted = Number.isInteger(result) ? result.toString() : result.toFixed(2);
                    setDisplay(formatted);
                    setEquation("");
                    setIsNewNumber(true);
                } catch (e) {
                    setDisplay("Error");
                }
            }, [display, equation]);

            useEffect(() => {
                if (!isOpen) return;
                const handleKeyDown = (e) => {
                    if (/[0-9]/.test(e.key)) handleNumber(e.key);
                    if (e.key === '.' || e.key === ',') handleNumber('.');
                    if (['+', '-', '*', '/'].includes(e.key)) handleOperator(e.key);
                    if (e.key === 'Enter') { e.preventDefault(); handleEqual(); }
                    if (e.key === 'Escape' || e.key === 'Delete') handleClear();
                    if (e.key === 'Backspace') setDisplay(prev => prev.length > 1 ? prev.slice(0, -1) : "0");
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isOpen, handleNumber, handleOperator, handleEqual, handleClear]);

            const btnClass = "p-2 text-lg font-bold rounded-xl transition-all duration-150 active:scale-90 flex items-center justify-center ";
            const numClass = btnClass + "bg-slate-100 dark:bg-slate-700/50 text-slate-800 dark:text-white hover:bg-slate-200 dark:hover:bg-slate-600 shadow-sm border border-slate-200 dark:border-slate-600";
            const opClass = btnClass + "bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 hover:bg-blue-100 dark:hover:bg-blue-900/40 border border-blue-100 dark:border-blue-800";
            const eqClass = btnClass + "bg-gradient-to-br from-blue-600 to-blue-700 text-white hover:to-blue-800 shadow-lg shadow-blue-500/30 col-span-2";
            const clearClass = btnClass + "bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 hover:bg-red-100 border border-red-100 dark:border-red-900/30 col-span-2";

            return (
                <div className="select-none p-2">
                    <div className="bg-slate-50 dark:bg-slate-900/50 p-2 rounded-xl text-right mb-2 shadow-inner border border-slate-200 dark:border-slate-700">
                        <div className="text-xs text-slate-400 h-4 font-mono tracking-wider">{equation}</div>
                        <div className="text-2xl font-bold dark:text-white truncate font-mono tracking-tight">{display}</div>
                    </div>
                    <div className="grid grid-cols-4 gap-2">
                        <button onClick={handleClear} className={clearClass}>C</button>
                        <button onClick={() => handleOperator('/')} className={opClass}>÷</button>
                        <button onClick={() => handleOperator('*')} className={opClass}>×</button>
                        {[7, 8, 9].map(n => <button key={n} onClick={() => handleNumber(n)} className={numClass}>{n}</button>)}
                        <button onClick={() => handleOperator('-')} className={opClass}>-</button>
                        {[4, 5, 6].map(n => <button key={n} onClick={() => handleNumber(n)} className={numClass}>{n}</button>)}
                        <button onClick={() => handleOperator('+')} className={opClass}>+</button>
                        {[1, 2, 3].map(n => <button key={n} onClick={() => handleNumber(n)} className={numClass}>{n}</button>)}
                        <button onClick={handleEqual} className={eqClass}>=</button>
                        <button onClick={() => handleNumber(0)} className={numClass + " col-span-2"}>0</button>
                        <button onClick={() => handleNumber('.')} className={numClass}>.</button>
                    </div>
                </div>
            );
        };

        // --- COMPONENTE: ANOTADOR ---
        const NotesView = ({ notes, onAdd, onResolve, products, user, onViewTicket }) => {
            const [type, setType] = useState("NOTA");
            const [text, setText] = useState("");
            const [productSearch, setProductSearch] = useState("");
            const [showSuggestions, setShowSuggestions] = useState(false);

            useEffect(() => { lucide.createIcons(); }, [notes]);

            const filteredProducts = productSearch.length > 1 
                ? products.filter(p => p.nombre.toLowerCase().includes(productSearch.toLowerCase())) 
                : [];

            const handleProductSelect = (p) => {
                setText(`Faltante: ${p.nombre} (Stock actual: ${p.stock})`);
                setProductSearch("");
                setShowSuggestions(false);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!text.trim()) return;
                onAdd(type, text);
                setText("");
                setType("NOTA");
            };

            const getTypeColor = (t) => {
                switch(t) {
                    case 'FALTANTE': return 'bg-red-50 border-red-200 text-red-700 dark:bg-red-900/10 dark:border-red-900/30 dark:text-red-300';
                    case 'FIADO': return 'bg-orange-50 border-orange-200 text-orange-700 dark:bg-orange-900/10 dark:border-orange-900/30 dark:text-orange-300';
                    case 'AVISO': return 'bg-blue-50 border-blue-200 text-blue-700 dark:bg-blue-900/10 dark:border-blue-900/30 dark:text-blue-300';
                    default: return 'bg-slate-50 border-slate-200 text-slate-700 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300';
                }
            };

            return (
                <div className="p-4 max-w-4xl mx-auto h-full flex flex-col animate-in fade-in duration-500">
                    <h2 className="text-xl font-bold text-slate-800 dark:text-white mb-4 flex items-center gap-3">
                        <div className="p-1 bg-slate-200 dark:bg-slate-800 rounded-lg"><i data-lucide="clipboard-list" className="w-5 h-5"></i></div>
                        Anotador / Deudas
                    </h2>
                    <div className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-lg shadow-slate-200/50 dark:shadow-none border border-slate-200 dark:border-slate-700 mb-4">
                        <form onSubmit={handleSubmit} className="flex flex-col gap-3">
                            <div className="flex flex-col md:flex-row gap-2">
                                <select value={type} onChange={e => setType(e.target.value)} className="p-2 text-sm rounded-xl border border-slate-200 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 dark:text-white font-bold cursor-pointer focus:ring-2 focus:ring-blue-500 outline-none">
                                    <option value="NOTA">Nota General</option>
                                    <option value="FALTANTE">Faltante</option>
                                    <option value="FIADO">Fiado / Deuda</option>
                                    <option value="AVISO">Aviso Importante</option>
                                </select>
                                <div className="flex-1 relative space-y-2">
                                    {type === 'FALTANTE' && (
                                        <div className="relative">
                                            <input type="text" placeholder="Buscar producto faltante..." className="w-full p-2 text-sm rounded-xl border border-red-200 dark:border-red-900 bg-red-50 dark:bg-slate-900/50 dark:text-white pl-8 focus:ring-2 focus:ring-red-500 outline-none transition-all" value={productSearch} onChange={e => { setProductSearch(e.target.value); setShowSuggestions(true); }} onFocus={() => setShowSuggestions(true)} />
                                            <i data-lucide="search" className="absolute left-2 top-2.5 text-red-400 w-4 h-4"></i>
                                            {showSuggestions && filteredProducts.length > 0 && (
                                                <div className="absolute top-full left-0 right-0 mt-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl z-50 max-h-40 overflow-y-auto">
                                                    {filteredProducts.map(p => (
                                                        <div key={p.id} className="p-2 text-sm hover:bg-slate-100 dark:hover:bg-slate-700 cursor-pointer flex justify-between items-center text-slate-700 dark:text-white border-b dark:border-slate-700 last:border-0" onClick={() => handleProductSelect(p)}>
                                                            <span className="font-medium">{p.nombre}</span>
                                                            <span className={`text-xs font-bold px-2 py-0.5 rounded ${p.stock <= 0 ? 'bg-red-100 text-red-600' : 'bg-green-100 text-green-600'}`}>{p.stock} un.</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}
                                    <input type="text" placeholder={type === 'FALTANTE' ? "O escribí el faltante manualmente..." : "Escribí tu nota acá..."} className="w-full p-2 text-sm rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 dark:text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all shadow-sm" value={text} onChange={e => setText(e.target.value)} autoFocus />
                                </div>
                                <button type="submit" className="bg-slate-900 hover:bg-black dark:bg-white dark:hover:bg-slate-200 dark:text-black text-white p-2 rounded-xl px-4 font-bold transition-all transform active:scale-95 flex items-center justify-center shadow-lg">
                                    <i data-lucide="send" className="w-4 h-4"></i>
                                </button>
                            </div>
                        </form>
                    </div>

                    <div className="flex-1 overflow-y-auto space-y-2 pr-2 pb-4">
                        {notes.length === 0 ? (
                            <div className="text-center text-slate-400 mt-10 flex flex-col items-center">
                                <div className="w-16 h-16 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mb-2">
                                    <i data-lucide="sticky-note" className="w-8 h-8 opacity-30"></i>
                                </div>
                                <p className="text-sm">No hay notas pendientes.</p>
                            </div>
                        ) : (
                            notes.slice().reverse().map(note => (
                                <div key={note.id} className={`p-3 rounded-2xl border flex justify-between items-start ${getTypeColor(note.tipo)} transition-all hover:translate-x-1 hover:shadow-md`}>
                                    <div className="flex-1">
                                        <div className="flex items-center gap-2 mb-1">
                                            <span className="text-[10px] font-black uppercase tracking-wider opacity-70 border border-current px-1.5 py-0.5 rounded-full">{note.tipo}</span>
                                            <span className="text-[10px] opacity-60 flex items-center gap-1"><i data-lucide="clock" className="w-3 h-3"></i> {new Date(note.fecha).toLocaleString()}</span>
                                            <span className="text-[10px] font-bold bg-white/50 px-1.5 py-0.5 rounded-full dark:bg-black/30 dark:text-white/70">{note.autor}</span>
                                        </div>
                                        <p className="font-medium text-sm leading-relaxed">{note.texto}</p>
                                        
                                        {note.saleId && (
                                            <button onClick={() => onViewTicket(note.saleId)} className="mt-2 text-[10px] font-bold flex items-center gap-1 bg-white/40 hover:bg-white/60 dark:bg-black/20 dark:hover:bg-black/40 px-2 py-1 rounded-lg transition-all border border-current/20">
                                                <i data-lucide="ticket" className="w-3 h-3"></i> VER TICKET ORIGINAL
                                            </button>
                                        )}
                                    </div>
                                    <div className="flex items-center gap-2">
                                        {user.rol === 'admin' && (
                                            <button onClick={() => onResolve(note.id)} className="ml-2 p-2 bg-white/50 hover:bg-green-500 hover:text-white rounded-xl transition-all text-slate-600 dark:text-slate-300 dark:bg-black/20 hover:scale-110 shadow-sm" title="Marcar como resuelto">
                                                <i data-lucide="check" className="w-4 h-4"></i>
                                            </button>
                                        )}
                                    </div>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        };

        // --- MODAL VERIFICADOR ---
        const PriceCheckerModal = ({ isOpen, onClose, products }) => {
            const [query, setQuery] = useState("");
            const [product, setProduct] = useState(null);
            const inputRef = useRef(null);

            useEffect(() => {
                if (isOpen) {
                    setTimeout(() => inputRef.current?.focus(), 100);
                    setProduct(null);
                    setQuery("");
                }
            }, [isOpen]);

            const handleSearch = (e) => {
                e.preventDefault();
                const term = query.trim().toLowerCase();
                if(!term) return;

                const found = products.find(p => p.codigo.toLowerCase() === term) || products.find(p => p.codigo.toLowerCase().includes(term) || p.nombre.toLowerCase().includes(term));
                
                if (found) {
                    setProduct(found);
                    playSound('beep');
                } else {
                    setProduct(null);
                    playSound('error');
                }
                setQuery(""); 
            };

            if (!isOpen) return null;

            return (
                <div className="fixed inset-0 bg-slate-900/80 flex items-center justify-center z-[90] p-4 backdrop-blur-md animate-in fade-in duration-300">
                    <div className="bg-white dark:bg-slate-900 rounded-[1.5rem] shadow-2xl w-full max-w-2xl overflow-hidden border border-slate-200 dark:border-slate-800 relative flex flex-col h-[500px]">
                        <button onClick={onClose} className="absolute top-4 right-4 bg-slate-100 dark:bg-slate-800 p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-700 transition z-10">
                            <i data-lucide="x" className="w-5 h-5 text-slate-500 dark:text-slate-300"></i>
                        </button>
                        <div className="p-6 flex-1 flex flex-col items-center justify-center text-center space-y-4 bg-gradient-to-b from-slate-50 to-white dark:from-slate-900 dark:to-slate-950">
                            <h2 className="text-2xl font-black text-slate-800 dark:text-white uppercase tracking-tight mb-2 flex items-center gap-2">
                                <div className="p-2 bg-blue-100 dark:bg-blue-900/30 rounded-xl text-blue-600 dark:text-blue-400">
                                    <i data-lucide="scan-barcode" className="w-6 h-6"></i>
                                </div>
                                Verificador
                            </h2>
                            {product ? (
                                <div className="animate-in zoom-in duration-300 space-y-4 w-full max-w-lg">
                                    <div className="p-6 bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-700 relative overflow-hidden group">
                                        <div className="absolute top-0 left-0 w-2 h-full bg-blue-500"></div>
                                        <h3 className="text-2xl font-bold text-slate-800 dark:text-white mb-1 tracking-tight">{product.nombre}</h3>
                                        <p className="text-sm text-slate-500 dark:text-slate-400 font-mono mb-4 bg-slate-100 dark:bg-slate-900 inline-block px-2 py-0.5 rounded-lg">{product.codigo}</p>
                                        <div className="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-blue-400 tracking-tighter drop-shadow-sm scale-105 transform transition-transform group-hover:scale-110">
                                            ${product.precio}
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div className="bg-slate-100 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-200 dark:border-slate-700">
                                            <p className="text-[10px] font-bold uppercase text-slate-500 dark:text-slate-400 tracking-wider mb-1">Stock Disponible</p>
                                            <p className={`text-xl font-black ${product.stock <= 0 ? 'text-red-500' : 'text-green-500'}`}>{product.stock}</p>
                                        </div>
                                        <div className="bg-slate-100 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-200 dark:border-slate-700">
                                            <p className="text-[10px] font-bold uppercase text-slate-500 dark:text-slate-400 tracking-wider mb-1">Categoría</p>
                                            <p className="text-xl font-bold text-slate-700 dark:text-white">{product.categoria}</p>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <div className="text-slate-400 flex flex-col items-center animate-pulse">
                                    <div className="w-24 h-24 bg-slate-100 dark:bg-slate-800 rounded-2xl flex items-center justify-center mb-4">
                                        <i data-lucide="qr-code" className="w-12 h-12 opacity-50"></i>
                                    </div>
                                    <p className="text-lg font-medium">Escaneá un producto...</p>
                                </div>
                            )}
                        </div>
                        <div className="p-6 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 shadow-[0_-10px_40px_rgba(0,0,0,0.1)]">
                             <form onSubmit={handleSearch} className="relative max-w-xl mx-auto">
                                <i data-lucide="search" className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-6 h-6"></i>
                                <input ref={inputRef} type="text" value={query} onChange={e => setQuery(e.target.value)} className="w-full pl-14 pr-4 py-4 text-2xl font-bold rounded-xl border-2 border-slate-200 dark:border-slate-700 focus:border-blue-500 focus:ring-4 focus:ring-blue-100 dark:focus:ring-blue-900/30 outline-none shadow-inner bg-slate-50 dark:bg-slate-800 dark:text-white transition-all" placeholder="Código de barras..." autoFocus onBlur={() => setTimeout(() => inputRef.current?.focus(), 100)} />
                            </form>
                            <p className="text-center text-slate-400 text-xs mt-3 font-bold">PRESIONÁ <span className="bg-slate-200 dark:bg-slate-700 px-1.5 py-0.5 rounded text-slate-600 dark:text-slate-300 font-mono">ESC</span> PARA SALIR</p>
                        </div>
                    </div>
                </div>
            )
        };
        
        // --- MODAL SERVICIOS ---
        const ServiceModal = ({ type, onConfirm, onCancel }) => {
            const [amount, setAmount] = useState('');
            const inputRef = useRef(null);

            useEffect(() => { if(inputRef.current) inputRef.current.focus(); }, []);
            
            const handleSubmit = (e) => {
                e.preventDefault();
                if(amount && parseFloat(amount) > 0) onConfirm(type, amount);
            };

            return (
                <div className="fixed inset-0 bg-slate-900/80 flex items-center justify-center z-[70] p-4 backdrop-blur-md animate-in fade-in zoom-in duration-300">
                    <div className="bg-white dark:bg-slate-900 rounded-[1.5rem] shadow-2xl w-full max-w-xs overflow-hidden border border-slate-200 dark:border-slate-700">
                        <div className={`p-4 text-white flex justify-between items-center bg-gradient-to-r ${type === 'SUBE' ? 'from-blue-500 to-blue-600' : 'from-purple-600 to-purple-700'}`}>
                            <h3 className="font-bold text-lg flex items-center gap-2">
                                {type === 'SUBE' ? <i data-lucide="bus" className="w-5 h-5"></i> : <i data-lucide="smartphone" className="w-5 h-5"></i>} 
                                Carga {type}
                            </h3>
                            <button onClick={onCancel} className="p-1 hover:bg-white/20 rounded-full transition"><i data-lucide="x" className="w-5 h-5"></i></button>
                        </div>
                        <div className="p-6">
                            <form onSubmit={handleSubmit}>
                                <div className="mb-6 text-center">
                                    <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-2 uppercase tracking-wide">Monto a Cargar</label>
                                    <div className="relative">
                                        <span className="absolute left-6 top-1/2 -translate-y-1/2 text-xl font-bold text-slate-400">$</span>
                                        <input ref={inputRef} type="number" step="any" className="w-full pl-6 pr-4 py-3 text-3xl font-black text-slate-800 dark:text-white bg-slate-50 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-xl focus:border-blue-500 outline-none text-center shadow-inner transition-all focus:bg-white dark:focus:bg-black" placeholder="0" value={amount} onChange={e => setAmount(e.target.value)} />
                                    </div>
                                </div>
                                <button type="submit" disabled={!amount || parseFloat(amount) <= 0} className={`w-full py-3 text-white font-bold rounded-xl transition-all hover:scale-105 active:scale-95 disabled:opacity-50 disabled:scale-100 flex justify-center gap-2 shadow-lg ${type === 'SUBE' ? 'bg-blue-600 hover:bg-blue-700 shadow-blue-500/30' : 'bg-purple-600 hover:bg-purple-700 shadow-purple-500/30'}`}>
                                    CONFIRMAR CARGA
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('login'); 
            const [user, setUser] = useState(() => {
                try { return JSON.parse(sessionStorage.getItem('kiosco_current_user_clean')) || null; } catch { return null; }
            });
            const [darkMode, setDarkMode] = useState(() => {
                try { return JSON.parse(localStorage.getItem('kiosco_dark_mode')) || false; } catch { return false; }
            });

            const [products, setProducts] = useState(() => {
                try { return JSON.parse(localStorage.getItem('kiosco_products_clean')) || PRODUCTOS_INICIALES; } catch { return PRODUCTOS_INICIALES; }
            });
            const [sales, setSales] = useState(() => {
                try { return JSON.parse(localStorage.getItem('kiosco_sales_clean')) || []; } catch { return []; }
            });
            const [expenses, setExpenses] = useState(() => {
                try { return JSON.parse(localStorage.getItem('kiosco_expenses_clean')) || []; } catch { return []; }
            });
            const [lastClose, setLastClose] = useState(() => {
                try { return parseInt(localStorage.getItem('kiosco_last_close_clean')) || 0; } catch { return 0; }
            });
            const [notes, setNotes] = useState(() => {
                try { return JSON.parse(localStorage.getItem('kiosco_notes_clean')) || []; } catch { return []; }
            });
            const [services, setServices] = useState(() => {
                try { return JSON.parse(localStorage.getItem('kiosco_services_clean')) || []; } catch { return []; }
            });

            const [session, setSession] = useState(() => {
                try { return JSON.parse(localStorage.getItem('kiosco_shared_session_clean')) || null; } catch { return null; }
            });
            const [cart, setCart] = useState([]);
            const [lastSaleForTicket, setLastSaleForTicket] = useState(null);

            useEffect(() => {
                if (darkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
                localStorage.setItem('kiosco_dark_mode', JSON.stringify(darkMode));
            }, [darkMode]);

            const toggleDarkMode = () => setDarkMode(!darkMode);

            useEffect(() => {
                const ids = new Set();
                let duplicatesFixed = false;
                const sanitizedProducts = products.map((p, index) => {
                    let fixedP = { ...p };
                    if (!fixedP.id || ids.has(fixedP.id)) {
                        duplicatesFixed = true;
                        fixedP.id = generateUniqueId() + `-${index}`; 
                    }
                    ids.add(fixedP.id);
                    if (!fixedP.categoria) { fixedP.categoria = "Varios"; duplicatesFixed = true; }
                    return fixedP;
                });
                if (duplicatesFixed) {
                    setProducts(sanitizedProducts);
                    localStorage.setItem('kiosco_products_clean', JSON.stringify(sanitizedProducts));
                }
            }, [products]);
            
            useEffect(() => {
                const handleStorageChange = (e) => {
                    if (e.key === 'kiosco_products_clean' && e.newValue) setProducts(JSON.parse(e.newValue));
                    if (e.key === 'kiosco_sales_clean' && e.newValue) setSales(JSON.parse(e.newValue));
                    if (e.key === 'kiosco_expenses_clean' && e.newValue) setExpenses(JSON.parse(e.newValue));
                    if (e.key === 'kiosco_last_close_clean' && e.newValue) setLastClose(parseInt(e.newValue));
                    if (e.key === 'kiosco_notes_clean' && e.newValue) setNotes(JSON.parse(e.newValue));
                    if (e.key === 'kiosco_services_clean' && e.newValue) setServices(JSON.parse(e.newValue));
                    if (e.key === 'kiosco_shared_session_clean') {
                        const newSession = e.newValue ? JSON.parse(e.newValue) : null;
                        setSession(newSession);
                        if (!newSession && user && view === 'pos') {
                            alert("La caja ha sido cerrada por otro usuario.");
                            setView('login');
                            setUser(null);
                        }
                    }
                };
                window.addEventListener('storage', handleStorageChange);
                return () => window.removeEventListener('storage', handleStorageChange);
            }, [user, view]);

            useEffect(() => {
                localStorage.setItem('kiosco_products_clean', JSON.stringify(products));
                localStorage.setItem('kiosco_sales_clean', JSON.stringify(sales));
                localStorage.setItem('kiosco_expenses_clean', JSON.stringify(expenses));
                localStorage.setItem('kiosco_last_close_clean', lastClose);
                localStorage.setItem('kiosco_notes_clean', JSON.stringify(notes));
                localStorage.setItem('kiosco_services_clean', JSON.stringify(services));
            }, [products, sales, expenses, lastClose, notes, services]);

            useEffect(() => {
                if (session) localStorage.setItem('kiosco_shared_session_clean', JSON.stringify(session));
                else localStorage.removeItem('kiosco_shared_session_clean');
            }, [session]);

            useEffect(() => {
                if (user) {
                    sessionStorage.setItem('kiosco_current_user_clean', JSON.stringify(user));
                    if (user.rol === 'admin') setView('pos');
                    else session && session.estado === 'ABIERTA' ? setView('pos') : setView('apertura_caja');
                } else {
                    sessionStorage.removeItem('kiosco_current_user_clean');
                    setView('login');
                }
            }, [user]);

            useEffect(() => { lucide.createIcons(); }, [view, user, session, cart, lastSaleForTicket, darkMode]);

            const handleLogin = (u) => setUser(u);
            const handleLogout = () => { setUser(null); setCart([]); setView('login'); };

            const abrirCaja = (monto) => {
                const nueva = {
                    id: Date.now(),
                    usuario_apertura: user.nombre,
                    fecha_apertura: new Date().toISOString(),
                    saldo_inicial: parseFloat(monto),
                    estado: 'ABIERTA',
                    ventas_sesion: []
                };
                setSession(nueva);
                setView('pos');
            };

            const cerrarCaja = (efectivo, totalGastos) => {
                const ventasDelTurno = sales.filter(s => s.sesion_id === session?.id);
                const totalEfectivo = ventasDelTurno.filter(v => v.metodo === 'EFECTIVO').reduce((sum, v) => sum + v.total, 0);
                
                const serviciosDelTurno = services.filter(s => s.sesion_id === session?.id);
                const totalServicios = serviciosDelTurno.reduce((sum, s) => sum + s.monto, 0);

                const saldoIni = session?.saldo_inicial || 0;
                
                const esperadoEnCaja = (saldoIni + totalEfectivo + totalServicios) - totalGastos;
                const dif = parseFloat(efectivo) - esperadoEnCaja;
                
                let msg = user.rol === 'admin' ? "CIERRE GLOBAL REALIZADO." : "TURNO CERRADO.";
                if(user.rol === 'admin') {
                    const ts = Date.now();
                    setLastClose(ts);
                    localStorage.setItem('kiosco_last_close_clean', ts);
                }
                alert(`${msg}\n\nTotal Servicios/Cargas: $${totalServicios}\nTotal Gastos: $${totalGastos}\nEsperado en Caja: $${esperadoEnCaja}\nDiferencia: $${dif.toLocaleString('es-AR', { style: 'currency', currency: 'ARS' })}`);
                
                // CORRECCIÓN CRÍTICA: NO BORRAR VENTAS NI SERVICIOS NI GASTOS AL CERRAR CAJA
                // setSales([]);       <--- ESTO ERA EL ERROR
                // setServices([]);    <--- ESTO ERA EL ERROR
                // setExpenses([]);    <--- ESTO ERA EL ERROR
                
                // Solo cerramos la sesión actual
                setSession(null); 
                setCart([]); 
                setUser(null); 
                setView('login');
            };
            
            const handleServiceTransaction = (type, amount) => {
                if (!session) { alert("Abrir caja primero."); return; }
                
                const realUser = USUARIOS.find(u => u.id === user.id);
                const vendedorNombre = user.rol === 'admin' ? user.nombre : realUser.alias;

                const newService = {
                    id: Date.now(),
                    tipo: type,
                    monto: parseFloat(amount),
                    fecha: new Date().toISOString(),
                    vendedor: vendedorNombre, 
                    sesion_id: session.id
                };
                setServices([...services, newService]);
                playSound('cash');
            };

            const addToCart = (product, quantity = 1) => {
                if (!session && user.rol !== 'admin') { 
                    if (confirm("¿Abrir caja ahora?")) setView('apertura_caja');
                    return;
                }
                if (!session && user.rol === 'admin') {
                    if (confirm("Modo Supervisión: ¿Abrir caja?")) setView('apertura_caja');
                    return;
                }

                const currentStock = product.es_combo ? calculateComboStock(product, products) : product.stock;

                if (currentStock <= 0) { 
                    playSound('error');
                    alert("¡Sin Stock!"); 
                    return; 
                }

                playSound('beep'); 

                const existing = cart.find(item => item.id === product.id);
                if (existing) {
                    if (existing.cantidad + quantity > currentStock) { alert(`Stock insuficiente. Quedan ${currentStock}`); return; }
                    setCart(cart.map(item => item.id === product.id ? { ...item, cantidad: item.cantidad + quantity } : item));
                } else {
                    if (quantity > currentStock) { alert(`Stock insuficiente. Quedan ${currentStock}`); return; }
                    setCart([...cart, { ...product, cantidad: quantity, stock_virtual: currentStock }]);
                }
            };

            const updateCartQuantity = (productId, change) => {
                setCart(prevCart => prevCart.map(item => {
                    if (item.id === productId) {
                        const nuevaCantidad = item.cantidad + change;
                        if (nuevaCantidad < 1) return item;
                        const product = products.find(p => p.id === productId);
                        const currentStock = product.es_combo ? calculateComboStock(product, products) : product.stock;
                        if (nuevaCantidad > currentStock) {
                            playSound('error');
                            alert(`Stock insuficiente. Máximo disponible: ${currentStock}`);
                            return item;
                        }
                        playSound('beep');
                        return { ...item, cantidad: nuevaCantidad };
                    }
                    return item;
                }));
            };

            const removeFromCart = (pid) => setCart(cart.filter(item => item.id !== pid));

            const handleAddNote = (type, text, saleId = null) => {
                const newNote = {
                    id: Date.now(),
                    tipo: type,
                    texto: text,
                    fecha: new Date().toISOString(),
                    autor: user.alias,
                    saleId: saleId 
                };
                setNotes(prev => [...prev, newNote]);
            };

            const finalizeSale = (method) => {
                if (!session) { alert("Abrir caja primero."); return; }
                if (cart.length === 0) return;
                
                let rawTotal = cart.reduce((sum, item) => sum + (parseFloat(item.precio) * parseFloat(item.cantidad)), 0);
                // REDONDEO SEGURO
                let currentTotal = Math.round((rawTotal + Number.EPSILON) * 100) / 100;
                
                let finalItems = [...cart];
                let nombreFiado = "";
                if (method === 'FIADO') {
                    nombreFiado = prompt("¿A nombre de quién anotamos el fiado?", "Cliente");
                    if (nombreFiado === null) return; 
                }

                if (method === 'DEBITO') {
                    const recargo = currentTotal * 0.10;
                    const totalConRecargo = currentTotal + recargo;
                    if(!confirm(`Cobrar con TARJETA tiene 10% de recargo.\n\nSubtotal: $${currentTotal.toFixed(2)}\nRecargo: $${recargo.toFixed(2)}\nTOTAL FINAL: $${totalConRecargo.toFixed(2)}\n\n¿Confirmar cobro?`)) return;
                    currentTotal = totalConRecargo;
                    finalItems.push({ id: 'recargo-tarjeta', nombre: 'Recargo Tarjeta (10%)', cantidad: 1, precio: recargo, es_pesable: false, es_combo: false });
                }

                playSound('cash'); 

                const deductions = {}; 
                cart.forEach(item => {
                    if (item.es_combo) {
                        item.componentes.forEach(comp => {
                            deductions[comp.id] = (deductions[comp.id] || 0) + (comp.cantidad * item.cantidad);
                        });
                    } else {
                        deductions[item.id] = (deductions[item.id] || 0) + item.cantidad;
                    }
                });

                const updatedProducts = products.map(p => {
                    if (deductions[p.id]) {
                        return { ...p, stock: parseFloat((p.stock - deductions[p.id]).toFixed(3)) };
                    }
                    return p;
                });

                // --- INTEGRIDAD DE DATOS ---
                const realUser = USUARIOS.find(u => u.id === user.id);
                const vendedorNombre = user.rol === 'admin' ? user.nombre : realUser.alias;

                const saleId = Date.now();
                const newSale = {
                    id: saleId,
                    fecha: new Date().toISOString(),
                    vendedor: vendedorNombre,
                    items: finalItems,
                    total: parseFloat(currentTotal.toFixed(2)),
                    metodo: method,
                    sesion_id: session.id,
                    cliente: nombreFiado
                };
                
                setProducts(updatedProducts);
                setSales(prevSales => [...prevSales, newSale]); // CORREGIDO: Usar prevSales para seguridad
                setSession({ ...session, ventas_sesion: [...session.ventas_sesion, newSale.id] });
                setCart([]);
                setLastSaleForTicket(newSale);

                if (method === 'FIADO') {
                    handleAddNote('FIADO', `DEUDA: ${nombreFiado} debe $${currentTotal.toFixed(2)} por esta compra.`, saleId);
                }
            };

            const processSale = (method) => {
                if (!session) { alert("Abrir caja primero."); return; }
                if (cart.length === 0) return;
                if (method === 'EFECTIVO') return true; 
                else { finalizeSale(method); return false; }
            };

            const addExpense = (desc, amount) => {
                const newExp = {
                    id: Date.now(),
                    descripcion: desc,
                    monto: parseFloat(amount),
                    fecha: new Date().toISOString(),
                    usuario: user.nombre,
                    sesion_id: session ? session.id : null
                };
                setExpenses([...expenses, newExp]);
            };

            const handleResolveNote = (id) => { setNotes(notes.filter(n => n.id !== id)); };

            const restoreSystem = (data) => {
                try {
                    if (data.products) setProducts(data.products);
                    if (data.sales) setSales(data.sales);
                    if (data.expenses) setExpenses(data.expenses);
                    if (data.lastClose) setLastClose(data.lastClose);
                    if (data.notes) setNotes(data.notes);
                    if (data.services) setServices(data.services);
                    alert("¡Sistema restaurado con éxito!");
                } catch (e) { alert("Error al restaurar: Archivo corrupto."); }
            };

            const handleViewTicketFromNote = (saleId) => {
                const sale = sales.find(s => s.id === saleId);
                if (sale) {
                    setLastSaleForTicket(sale);
                } else {
                    alert("No se encontró el ticket original. Es posible que haya sido borrado al cerrar caja.");
                }
            };

            const getSidebarColor = () => {
                if (!user) return "bg-slate-900/90 backdrop-blur-md";
                if (user.id === 2) return "bg-blue-900/90 backdrop-blur-md"; // Oso Polar
                if (user.id === 3) return "bg-green-900/90 backdrop-blur-md"; // Oso Panda
                return "bg-slate-900/90 backdrop-blur-md";
            };

            if (view === 'login') return <LoginView users={USUARIOS} onLogin={handleLogin} />;
            if (view === 'apertura_caja' && user) return <AperturaCajaView onConfirm={abrirCaja} user={user} />;
            if (view === 'cierre_caja' && session) return <CierreCajaView user={user} session={session} sales={sales} expenses={expenses} services={services} onClose={cerrarCaja} onCancel={() => setView('pos')} />;
            if (!user) return <LoginView users={USUARIOS} onLogin={handleLogin} />;

            return (
                <div className="flex h-screen overflow-hidden relative transition-colors duration-500 bg-slate-100 dark:bg-slate-950">
                    {lastSaleForTicket && <TicketModal sale={lastSaleForTicket} onClose={() => setLastSaleForTicket(null)} />}
                    <div className={`w-16 ${getSidebarColor()} text-white flex flex-col items-center py-4 gap-4 z-40 no-print transition-all duration-300 border-r border-white/10 shadow-2xl`}>
                        <div className="font-black text-lg bg-white/20 w-8 h-8 flex items-center justify-center rounded-xl shadow-lg border border-white/20 backdrop-blur-md transform hover:rotate-12 transition-transform">B</div>
                        <nav className="flex flex-col gap-3 w-full items-center">
                            <button onClick={() => setView('pos')} className={`p-3 rounded-xl transition-all duration-300 group relative ${view === 'pos' ? 'bg-white text-slate-900 shadow-lg shadow-white/20' : 'hover:bg-white/10 text-white/70'}`} title="Venta (POS)">
                                <i data-lucide="shopping-cart" className={`w-5 h-5 transition-transform ${view === 'pos' ? 'scale-110' : 'group-hover:scale-110'}`}></i>
                            </button>
                            {user?.rol === 'admin' && <button onClick={() => setView('admin')} className={`p-3 rounded-xl transition-all duration-300 group ${view === 'admin' ? 'bg-white text-slate-900 shadow-lg shadow-white/20' : 'hover:bg-white/10 text-white/70'}`} title="Administración"><i data-lucide="package" className="w-5 h-5"></i></button>}
                            <button onClick={() => setView('ventas')} className={`p-3 rounded-xl transition-all duration-300 group ${view === 'ventas' ? 'bg-white text-slate-900 shadow-lg shadow-white/20' : 'hover:bg-white/10 text-white/70'}`} title="Historial"><i data-lucide="history" className="w-5 h-5"></i></button>
                            <button onClick={() => setView('notas')} className={`p-3 rounded-xl transition-all duration-300 group relative ${view === 'notas' ? 'bg-white text-slate-900 shadow-lg shadow-white/20' : 'hover:bg-white/10 text-white/70'}`} title="Anotador / Deudas">
                                <i data-lucide="clipboard-list" className="w-5 h-5"></i>
                                {notes.length > 0 && <span className="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border-2 border-slate-900"></span>}
                            </button>
                        </nav>
                        
                        <div className="mt-auto flex flex-col gap-3 mb-2 items-center">
                            <button onClick={toggleDarkMode} className="p-3 rounded-xl hover:bg-white/10 text-white/70 transition-all active:rotate-180 duration-500" title="Cambiar Tema">
                                {darkMode ? <i data-lucide="sun" className="w-5 h-5"></i> : <i data-lucide="moon" className="w-5 h-5"></i>}
                            </button>
                            <button onClick={() => { if(!session) {alert("No hay sesión"); return;} setView('cierre_caja'); }} className="p-3 bg-gradient-to-br from-red-500 to-red-700 rounded-xl hover:scale-105 transition-transform text-white shadow-lg shadow-red-900/50" title="Cerrar Caja"><i data-lucide="trending-up" className="w-5 h-5"></i></button>
                            <button onClick={handleLogout} className="p-3 hover:bg-white/10 rounded-xl text-white/70 transition" title="Salir"><i data-lucide="log-out" className="w-5 h-5"></i></button>
                        </div>
                    </div>
                    <main className="flex-1 overflow-auto relative no-print transition-colors duration-500">
                        <div className="absolute inset-0 opacity-5 pointer-events-none bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9IiMwMDAiLz48L3N2Zz4=')] dark:bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9IiNmZmYiLz48L3N2Zz4=')]"></div>
                        
                        {view === 'pos' && <POSView products={products} cart={cart} addToCart={addToCart} updateCartQuantity={updateCartQuantity} removeFromCart={removeFromCart} processSale={processSale} finalizeSale={finalizeSale} user={user} session={session} sales={sales} lastClose={lastClose} services={services} onServiceAdd={handleServiceTransaction} />}
                        {view === 'admin' && user?.rol === 'admin' && <AdminView products={products} setProducts={setProducts} expenses={expenses} addExpense={addExpense} session={session} sales={sales} lastClose={lastClose} restoreSystem={restoreSystem} services={services} notes={notes} />}
                        {view === 'ventas' && <VentasView sales={sales} services={services} session={session} user={user} />}
                        {view === 'notas' && <NotesView notes={notes} onAdd={handleAddNote} onResolve={handleResolveNote} products={products} user={user} onViewTicket={handleViewTicketFromNote} />}
                    </main>
                </div>
            );
        };

        const CashModal = ({ total, onConfirm, onCancel }) => {
            const [pago, setPago] = useState("");
            const inputRef = useRef(null);

            useEffect(() => {
                if(inputRef.current) inputRef.current.focus();
                const handleKeyDown = (e) => { if (e.key === 'Escape') onCancel(); };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, []);

            const vuelto = pago ? parseFloat(pago) - total : 0;
            const handleQuickPay = (amount) => setPago(amount.toString());

            const handleSubmit = (e) => {
                e.preventDefault();
                if (parseFloat(pago) >= total) onConfirm();
            };

            return (
                <div className="fixed inset-0 bg-slate-900/80 flex items-center justify-center z-[70] p-4 backdrop-blur-md animate-in fade-in zoom-in duration-300">
                    <div className="bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl w-full max-w-sm overflow-hidden flex flex-col border border-slate-200 dark:border-slate-800">
                        <div className="bg-gradient-to-r from-green-500 to-emerald-600 p-6 text-white text-center relative overflow-hidden">
                            <div className="absolute inset-0 bg-white/10 opacity-50 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMSIgY3k9IjEiIHI9IjEiIGZpbGw9IiNmZmYiLz48L3N2Zz4=')]"></div>
                            <p className="text-xs font-bold opacity-90 uppercase tracking-widest mb-1 relative z-10">Total a Cobrar</p>
                            <h2 className="text-4xl font-black mt-1 tracking-tight relative z-10 text-shadow-sm">${total.toLocaleString('es-AR')}</h2>
                        </div>
                        <div className="p-6">
                            <form onSubmit={handleSubmit}>
                                <div className="mb-4">
                                    <label className="block text-slate-500 dark:text-slate-400 font-bold mb-2 text-[10px] uppercase tracking-wider">¿Con cuánto paga?</label>
                                    <div className="relative group">
                                        <span className="absolute left-4 top-1/2 -translate-y-1/2 text-xl font-bold text-slate-400 group-focus-within:text-green-500 transition-colors">$</span>
                                        <input ref={inputRef} type="number" className="w-full pl-8 pr-4 py-3 text-2xl font-bold text-slate-800 dark:text-white bg-slate-50 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-xl focus:border-green-500 dark:focus:border-green-500 outline-none transition-all shadow-inner" placeholder="0" value={pago} onChange={e => setPago(e.target.value)} />
                                    </div>
                                </div>
                                <div className="grid grid-cols-4 gap-2 mb-4">
                                    {[1000, 2000, 5000, 10000, 20000].map(amt => (
                                        <button key={amt} type="button" onClick={() => handleQuickPay(amt)} className="py-2 px-1 bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-white font-bold rounded-lg text-xs transition transform active:scale-95 shadow-sm border border-slate-200 dark:border-slate-700">${amt/1000}k</button>
                                    ))}
                                    <button type="button" onClick={() => handleQuickPay(total)} className="py-2 px-1 bg-blue-50 hover:bg-blue-100 dark:bg-blue-900/30 dark:hover:bg-blue-900/50 text-blue-600 dark:text-blue-300 font-bold rounded-lg text-xs transition transform active:scale-95 border border-blue-100 dark:border-blue-800 col-span-2">JUSTO</button>
                                </div>
                                <div className={`p-4 rounded-xl text-center mb-4 transition-all duration-300 ${vuelto >= 0 ? 'bg-green-50 dark:bg-green-900/20 border-2 border-green-200 dark:border-green-900/30 scale-105' : 'bg-red-50 dark:bg-red-900/20 border-2 border-red-200 dark:border-red-900/30'}`}>
                                    <p className={`text-[10px] font-bold uppercase tracking-widest ${vuelto >= 0 ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>{vuelto >= 0 ? 'Vuelto a Entregar' : 'Falta'}</p>
                                    <p className={`text-2xl font-black mt-1 ${vuelto >= 0 ? 'text-green-700 dark:text-green-400' : 'text-red-600 dark:text-red-400'}`}>${Math.abs(vuelto).toLocaleString('es-AR')}</p>
                                </div>
                                <div className="grid grid-cols-2 gap-3">
                                    <button type="button" onClick={onCancel} className="py-3 text-slate-500 dark:text-slate-400 font-bold hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition text-sm">CANCELAR</button>
                                    <button type="submit" disabled={!pago || parseFloat(pago) < total} className="py-3 bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-bold rounded-xl text-md shadow-lg shadow-green-600/30 disabled:opacity-50 disabled:shadow-none flex items-center justify-center gap-2 transition-all transform hover:scale-105 active:scale-95"><i data-lucide="check" className="w-4 h-4"></i> CONFIRMAR</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const TicketModal = ({ sale, onClose }) => {
            const printTicket = () => window.print();
            const esFiado = sale.metodo === 'FIADO';

            return (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[80] p-4 animate-in fade-in duration-300">
                    <div className="bg-white p-4 rounded-3xl shadow-2xl w-full max-w-sm flex flex-col h-auto max-h-[90vh] scale-100 animate-in zoom-in-95 duration-300">
                        <div id="ticket-modal" className="font-mono text-xs bg-white p-2 text-black border border-slate-200">
                            <div className="text-center mb-4">
                                <h2 className="font-black text-xl uppercase tracking-tighter">Kiosco Lo De Billi</h2>
                                <p className="text-[10px] uppercase tracking-widest mt-1 text-slate-500">Comprobante no fiscal</p>
                                {esFiado && (
                                    <div className="mt-2 bg-red-100 border border-red-200 text-red-700 p-1 rounded text-[10px] font-black uppercase tracking-widest">
                                        ¡COMPROBANTE DE DEUDA! (FIADO)
                                    </div>
                                )}
                                <p className="text-[10px] mt-2">{new Date(sale.fecha).toLocaleString()}</p>
                                <p className="text-[10px] font-bold mt-1">Vendedor: {sale.vendedor}</p>
                                {sale.cliente && <p className="text-xs font-black mt-2 bg-slate-100 p-1">CLIENTE: {sale.cliente}</p>}
                            </div>
                            <div className="border-b-2 border-dashed border-slate-300 my-2"></div>
                            <div className="space-y-2 mb-4">
                                {sale.items.map((item, idx) => (
                                    <div key={idx} className="flex justify-between items-start">
                                        <span className="truncate w-32 font-bold">{item.nombre}</span>
                                        <div className="text-right">
                                            <span className="text-[10px] text-slate-500 block">{item.es_pesable ? item.cantidad.toFixed(3) : item.cantidad} x ${item.precio}</span>
                                            <span className="block font-bold">${(item.cantidad * item.precio).toFixed(2)}</span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="border-b-2 border-dashed border-slate-300 my-2"></div>
                            <div className="flex justify-between font-black text-xl mb-2"><span>TOTAL</span><span>${sale.total.toFixed(2)}</span></div>
                            <div className="text-center text-[10px] mt-4 bg-slate-100 p-2 rounded">
                                <p className="font-bold uppercase">Estado: {esFiado ? 'PENDIENTE DE PAGO' : 'PAGADO'}</p>
                                <p className="mt-1">Método: {sale.metodo}</p>
                                <p className="mt-2 text-[9px] uppercase">¡Gracias por su compra!</p>
                            </div>
                        </div>
                        <div className="mt-4 grid grid-cols-2 gap-2 no-print">
                            <button onClick={printTicket} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl flex justify-center items-center gap-2 shadow-lg shadow-blue-500/30 transition-all hover:scale-105"><i data-lucide="printer" className="w-4 h-4"></i> IMPRIMIR</button>
                            <button onClick={onClose} className="bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-2 rounded-xl transition-colors">CERRAR</button>
                        </div>
                    </div>
                </div>
            );
        };

        const LoginView = ({ users, onLogin }) => {
            const [selectedId, setSelectedId] = useState("");
            const [pin, setPin] = useState("");
            const [shiftName, setShiftName] = useState("");

            const attemptLogin = (e) => { 
                e.preventDefault(); 
                const u = users.find(u => u.id === parseInt(selectedId)); 
                if (!u) return;

                if (u.rol === 'admin') {
                    if (u.pin === pin) onLogin(u);
                    else alert("PIN Incorrecto");
                } else {
                    if (shiftName.trim()) {
                        onLogin({
                            ...u,
                            nombre: shiftName.trim(),
                            alias: `${shiftName.trim()} (${u.alias.split('(')[0].trim() || u.alias})`
                        });
                    } else {
                        alert("Por favor, ingresá tu nombre para iniciar turno.");
                    }
                }
            };
            
            const selectedUser = users.find(u => u.id === parseInt(selectedId));

            const getCardColor = (u) => {
                const isSelected = selectedId === u.id;
                if (u.id === 2) return isSelected ? 'bg-blue-600 text-white border-blue-500 ring-4 ring-blue-500/30 scale-105 shadow-xl shadow-blue-500/20' : 'bg-white/80 dark:bg-slate-800/80 text-blue-800 dark:text-blue-200 border-white/20 hover:bg-blue-50 dark:hover:bg-blue-900/20';
                if (u.id === 3) return isSelected ? 'bg-green-600 text-white border-green-500 ring-4 ring-green-500/30 scale-105 shadow-xl shadow-green-500/20' : 'bg-white/80 dark:bg-slate-800/80 text-green-800 dark:text-green-200 border-white/20 hover:bg-green-50 dark:hover:bg-green-900/20';
                return isSelected ? 'bg-slate-800 text-white border-slate-700 ring-4 ring-slate-500/30 scale-105 shadow-xl shadow-slate-900/20' : 'bg-white/80 dark:bg-slate-800/80 text-slate-800 dark:text-slate-200 border-white/20 hover:bg-slate-50 dark:hover:bg-slate-700/50';
            };

            return (
                <div className="min-h-screen w-full flex items-center justify-center p-4 bg-[conic-gradient(at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-purple-900 to-slate-900 relative overflow-hidden">
                    <div className="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20 brightness-100 contrast-150"></div>
                    
                    <div className="glass-panel p-6 rounded-[2rem] shadow-2xl w-full max-w-4xl transition-all relative z-10 border border-white/10">
                        <div className="text-center mb-8">
                            <h1 className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-slate-800 to-slate-600 dark:from-white dark:to-slate-400 mb-2 tracking-tighter">Lo De Billi</h1>
                            <p className="text-slate-500 dark:text-slate-400 font-medium text-sm">Sistema de Gestión - Seleccioná tu perfil</p>
                        </div>
                        <form onSubmit={attemptLogin} className="flex flex-col items-center">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 w-full mb-8">
                                {users.map(u => (
                                    <button type="button" key={u.id} onClick={() => { setSelectedId(u.id); setPin(""); setShiftName(""); }} className={`p-6 rounded-[1.5rem] border flex flex-col items-center gap-4 transition-all duration-300 ${getCardColor(u)} backdrop-blur-sm`}>
                                        <div className={`w-16 h-16 rounded-full flex items-center justify-center font-bold text-3xl shadow-inner ${selectedId === u.id ? 'bg-white/20 backdrop-blur-md border border-white/30' : 'bg-slate-100 dark:bg-slate-700'}`}>{u.id === 1 ? '👩🏻‍💼' : (u.id === 2 ? '🐻‍❄️' : '🐼')}</div>
                                        <div className="text-center">
                                            <span className="font-black text-lg block tracking-tight mb-1">{u.alias}</span>
                                            <span className={`text-[10px] uppercase font-bold tracking-widest opacity-60 block bg-black/5 dark:bg-white/10 px-2 py-0.5 rounded-full`}>{u.rol}</span>
                                        </div>
                                    </button>
                                ))}
                            </div>
                            {selectedId && (
                                <div className="animate-in fade-in slide-in-from-bottom-8 duration-500 w-full max-w-xs">
                                    <div className="relative group">
                                        <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                            {selectedUser?.rol === 'admin' ? <i data-lucide="lock" className="text-slate-400 w-5 h-5"></i> : <i data-lucide="user" className="text-slate-400 w-5 h-5"></i>}
                                        </div>
                                        
                                        {selectedUser?.rol === 'admin' ? (
                                            <input 
                                                type="password" 
                                                className="w-full py-3 pl-12 pr-4 text-center text-3xl tracking-[0.5em] font-bold border-2 border-slate-200 dark:border-slate-600 rounded-xl focus:border-slate-800 dark:focus:border-white focus:ring-4 focus:ring-slate-200 dark:focus:ring-white/20 outline-none transition-all bg-white dark:bg-slate-800 dark:text-white shadow-xl" 
                                                placeholder="••••" 
                                                maxLength="4" 
                                                value={pin} 
                                                onChange={(e) => setPin(e.target.value)} 
                                                autoFocus 
                                            />
                                        ) : (
                                            <input 
                                                type="text" 
                                                className="w-full py-3 pl-12 pr-4 text-center text-xl font-bold border-2 border-slate-200 dark:border-slate-600 rounded-xl focus:border-blue-600 focus:ring-4 focus:ring-blue-200 dark:focus:ring-blue-900/50 outline-none transition-all bg-white dark:bg-slate-800 dark:text-white shadow-xl" 
                                                placeholder="Ingresá tu nombre..." 
                                                value={shiftName} 
                                                onChange={(e) => setShiftName(e.target.value)} 
                                                autoFocus 
                                            />
                                        )}
                                    </div>
                                    <button type="submit" className="w-full mt-4 bg-slate-900 hover:bg-black dark:bg-white dark:text-slate-900 dark:hover:bg-slate-200 py-3 rounded-xl font-bold text-md transition-all shadow-xl hover:shadow-2xl hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-2 group">
                                        INGRESAR 
                                        <div className="bg-white/20 rounded-full p-0.5 group-hover:translate-x-1 transition-transform"><i data-lucide="arrow-right" className="w-4 h-4"></i></div>
                                    </button>
                                </div>
                            )}
                        </form>
                    </div>
                </div>
            );
        };

        const AperturaCajaView = ({ onConfirm, user }) => {
            const [monto, setMonto] = useState("");
            return (
                <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                    <div className="bg-white dark:bg-slate-800 p-8 rounded-[2rem] w-full max-w-sm shadow-2xl text-center border border-slate-700 animate-in zoom-in duration-300">
                        <div className="w-16 h-16 bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner animate-float">
                            <i data-lucide="dollar-sign" className="w-8 h-8"></i>
                        </div>
                        <h2 className="text-2xl font-black mb-1 text-slate-800 dark:text-white tracking-tight">Apertura de Caja</h2>
                        <p className="text-slate-500 mb-6 text-sm">Ingresá el saldo inicial para comenzar.</p>
                        <div className="relative mb-4">
                            <span className="absolute left-6 top-1/2 -translate-y-1/2 text-xl font-bold text-slate-400">$</span>
                            <input type="number" className="w-full text-3xl font-bold text-center py-4 pl-8 pr-4 border-2 border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 dark:text-white rounded-xl focus:border-green-500 focus:ring-4 focus:ring-green-100 dark:focus:ring-green-900/20 outline-none transition-all shadow-inner" placeholder="0.00" value={monto} onChange={e => setMonto(e.target.value)} autoFocus />
                        </div>
                        <button onClick={() => onConfirm(monto || 0)} className="w-full bg-gradient-to-r from-green-500 to-emerald-600 hover:from-green-600 hover:to-emerald-700 text-white font-bold py-3 rounded-xl text-lg shadow-lg shadow-green-500/30 hover:scale-105 active:scale-95 transition-all">ABRIR CAJA</button>
                    </div>
                </div>
            )
        };

        const CierreCajaView = ({ user, session, sales, expenses, services, onClose, onCancel }) => {
            const [efectivoReal, setEfectivoReal] = useState("");
            
            const saldoIni = session ? session.saldo_inicial : 0;
            const ventasSesion = session ? sales.filter(s => s.sesion_id === session.id) : [];

            const totalEfectivo = ventasSesion.filter(v => v.metodo === 'EFECTIVO').reduce((s, v) => s + v.total, 0);
            const totalDigital = ventasSesion.filter(v => v.metodo !== 'EFECTIVO' && v.metodo !== 'FIADO').reduce((s, v) => s + v.total, 0);
            const totalFiado = ventasSesion.filter(v => v.metodo === 'FIADO').reduce((s, v) => s + v.total, 0);
            
            const serviciosSesion = services.filter(s => s.sesion_id === session?.id);
            const totalSube = serviciosSesion.filter(s => s.tipo === 'SUBE').reduce((s, serv) => s + serv.monto, 0);
            const totalVirtual = serviciosSesion.filter(s => s.tipo === 'VIRTUAL').reduce((s, serv) => s + serv.monto, 0);
            
            const totalServicios = totalSube + totalVirtual;

            const gastosSesion = expenses.filter(e => e.sesion_id === session?.id);
            const totalGastos = gastosSesion.reduce((s, e) => s + e.monto, 0);
            const teoricoCaja = (saldoIni + totalEfectivo + totalServicios) - totalGastos;
            const diferencia = (parseFloat(efectivoReal) || 0) - teoricoCaja;

            return (
                <div className="min-h-screen bg-slate-900/95 flex items-center justify-center p-4 fixed inset-0 z-50 overflow-y-auto backdrop-blur-sm animate-in fade-in duration-300">
