                    <div className="bg-white dark:bg-slate-900 rounded-[2rem] w-full max-w-2xl overflow-hidden shadow-2xl my-4 border border-slate-200 dark:border-slate-800">
                        <div className="bg-slate-800 text-white p-6 flex justify-between items-center bg-[url('https://grainy-gradients.vercel.app/noise.svg')]">
                            <h2 className="text-2xl font-black tracking-tight">{user.rol === 'admin' ? "Cierre Global" : "Cierre Turno"}</h2>
                            <div className="px-3 py-1 bg-white/10 rounded-full text-xs font-mono border border-white/20">{new Date().toLocaleDateString()}</div>
                        </div>
                        <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <h3 className="text-xs font-bold text-slate-400 dark:text-slate-500 uppercase mb-4 tracking-widest border-b border-slate-100 dark:border-slate-800 pb-2">Resumen Financiero</h3>
                                <div className="space-y-3 dark:text-slate-300 text-sm">
                                    <div className="flex justify-between items-center">
                                        <span className="text-slate-500 dark:text-slate-400">Saldo Inicial</span>
                                        <span className="font-mono font-bold bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded text-slate-600 dark:text-slate-300">${saldoIni}</span>
                                    </div>
                                    <div className="flex justify-between items-center text-green-600 dark:text-green-400 font-medium">
                                        <span className="flex items-center gap-2"><div className="w-1.5 h-1.5 bg-green-500 rounded-full"></div> Ventas Efectivo</span>
                                        <span className="font-mono font-bold">+${totalEfectivo}</span>
                                    </div>
                                    
                                    <div className="flex justify-between items-center text-blue-600 dark:text-blue-400 font-medium pl-3 border-l-2 border-blue-100 dark:border-blue-900/30">
                                        <span>Carga SUBE</span><span className="font-mono">+${totalSube}</span>
                                    </div>
                                    <div className="flex justify-between items-center text-purple-600 dark:text-purple-400 font-medium pl-3 border-l-2 border-purple-100 dark:border-purple-900/30">
                                        <span>Carga Virtual</span><span className="font-mono">+${totalVirtual}</span>
                                    </div>
                                    
                                    <div className="flex justify-between items-center text-red-600 dark:text-red-400 font-medium">
                                        <span className="flex items-center gap-2"><div className="w-1.5 h-1.5 bg-red-500 rounded-full"></div> Gastos/Retiros</span>
                                        <span className="font-mono font-bold">-${totalGastos}</span>
                                    </div>
                                    <div className="flex justify-between items-center text-slate-400 text-xs italic pt-1">
                                        <span>(Digital/Bancos)</span><span className="font-mono">${totalDigital}</span>
                                    </div>
                                    <div className="flex justify-between items-center text-orange-500 text-xs font-black pt-1">
                                        <span>(Fiados / Deudas)</span><span className="font-mono">${totalFiado}</span>
                                    </div>
                                    <div className="h-px bg-slate-200 dark:bg-slate-700 my-2"></div>
                                    <div className="flex justify-between font-black text-lg bg-slate-50 dark:bg-slate-800/50 text-slate-800 dark:text-white p-3 rounded-xl border border-slate-200 dark:border-slate-700">
                                        <span>Debe Haber</span>
                                        <span className="font-mono">${teoricoCaja}</span>
                                    </div>
                                </div>
                            </div>
                            <div className="flex flex-col gap-4 justify-center">
                                <div className="bg-slate-50 dark:bg-slate-800 p-6 rounded-2xl border-2 border-slate-200 dark:border-slate-700 shadow-inner">
                                    <label className="block text-xs font-bold text-slate-500 dark:text-slate-400 mb-2 uppercase tracking-wider text-center">Conteo Efectivo Real</label>
                                    <div className="relative">
                                        <span className="absolute left-4 top-1/2 -translate-y-1/2 text-xl font-bold text-slate-400">$</span>
                                        <input type="number" className="w-full pl-8 pr-4 py-3 text-3xl font-bold text-center border-2 border-slate-300 dark:border-slate-600 rounded-xl focus:ring-4 focus:ring-blue-100 dark:focus:ring-blue-900/30 focus:border-blue-500 bg-white dark:bg-slate-900 dark:text-white outline-none transition-all" value={efectivoReal} onChange={e => setEfectivoReal(e.target.value)} autoFocus placeholder="0" />
                                    </div>
                                </div>
                                {efectivoReal && (
                                    <div className={`p-4 rounded-xl text-center font-bold text-white shadow-lg animate-in zoom-in duration-300 ${diferencia >= 0 ? 'bg-gradient-to-r from-green-500 to-emerald-600 shadow-green-500/30' : 'bg-gradient-to-r from-red-500 to-rose-600 shadow-red-500/30'}`}>
                                        <p className="text-xs opacity-90 uppercase tracking-widest mb-1">{diferencia >= 0 ? 'SOBRANTE' : 'FALTANTE'}</p>
                                        <p className="text-2xl">${Math.abs(diferencia)}</p>
                                    </div>
                                )}
                            </div>
                        </div>
                        <div className="p-6 bg-slate-50 dark:bg-slate-900/50 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-3">
                            <button onClick={onCancel} className="px-6 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800 font-bold transition text-sm">Cancelar</button>
                            <button onClick={() => onClose(efectivoReal || 0, totalGastos)} className="px-8 py-3 rounded-xl bg-red-600 text-white font-bold hover:bg-red-700 shadow-lg shadow-red-600/30 hover:scale-105 active:scale-95 transition-all flex items-center gap-2 text-sm">
                                <i data-lucide="lock" className="w-4 h-4"></i> CERRAR CAJA
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const WeightModal = ({ product, onConfirm, onCancel }) => {
            const [mode, setMode] = useState('grams'); 
            const [value, setValue] = useState('');
            const inputRef = useRef(null);
            
            useEffect(() => { lucide.createIcons(); }, []);
            useEffect(() => { const handleEsc = (e) => { if (e.key === 'Escape') onCancel(); }; window.addEventListener('keydown', handleEsc); return () => window.removeEventListener('keydown', handleEsc); }, []);
            useEffect(() => { if(inputRef.current) inputRef.current.focus(); }, [mode]);

            let quantity = 0, estimatedPrice = 0, estimatedWeight = 0;
            if (value) {
                const numVal = parseFloat(value);
                if (mode === 'grams') { quantity = numVal / 1000; estimatedPrice = quantity * product.precio; estimatedWeight = numVal; } 
                else { quantity = numVal / product.precio; estimatedPrice = numVal; estimatedWeight = quantity * 1000; }
            }
            const handleSubmit = (e) => { e.preventDefault(); if (quantity > 0) onConfirm(quantity); };

            return (
                <div className="fixed inset-0 bg-slate-900/80 flex items-center justify-center z-[60] p-4 backdrop-blur-md animate-in fade-in zoom-in duration-300">
                    <div className="bg-white dark:bg-slate-800 rounded-[1.5rem] shadow-2xl w-full max-w-sm overflow-hidden border border-slate-200 dark:border-slate-700">
                        <div className="bg-blue-600 p-4 text-white flex justify-between items-center bg-gradient-to-r from-blue-600 to-blue-500">
                            <h3 className="font-bold text-md flex items-center gap-2">
                                <i data-lucide="scale" className="w-5 h-5"></i> 
                                {product.nombre}
                            </h3>
                            <button onClick={onCancel} className="p-1 hover:bg-white/20 rounded-full transition" title="Cerrar (Esc)"><i data-lucide="x" className="w-5 h-5"></i></button>
                        </div>
                        <div className="p-6">
                            <div className="flex gap-2 mb-6 bg-slate-100 dark:bg-slate-900 p-1 rounded-xl">
                                <button onClick={() => { setMode('grams'); setValue(''); }} className={`flex-1 py-2 rounded-lg font-bold text-xs transition-all ${mode === 'grams' ? 'bg-white dark:bg-slate-700 shadow-md text-blue-600 dark:text-blue-300' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800'}`}>POR PESO (Gramos)</button>
                                <button onClick={() => { setMode('money'); setValue(''); }} className={`flex-1 py-2 rounded-lg font-bold text-xs transition-all ${mode === 'money' ? 'bg-white dark:bg-slate-700 shadow-md text-green-600 dark:text-green-300' : 'text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800'}`}>POR MONTO ($)</button>
                            </div>
                            <form onSubmit={handleSubmit}>
                                <div className="mb-6 text-center">
                                    <label className="block text-xs font-bold text-slate-400 dark:text-slate-500 mb-2 uppercase tracking-wider">{mode === 'grams' ? '¿Cuántos gramos lleva?' : '¿Cuánto dinero quiere gastar?'}</label>
                                    <div className="relative group">
                                        <input ref={inputRef} type="number" step="any" className="w-full pl-6 pr-12 py-3 text-3xl font-bold text-slate-800 dark:text-white bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 rounded-xl focus:border-blue-500 outline-none text-center shadow-inner transition-all group-focus-within:bg-white dark:group-focus-within:bg-black" placeholder="0" value={value} onChange={e => setValue(e.target.value)} autoFocus />
                                        <span className="absolute right-6 top-1/2 -translate-y-1/2 text-slate-400 font-bold text-sm">{mode === 'grams' ? 'gr' : '$'}</span>
                                    </div>
                                </div>
                                <div className="bg-slate-50 dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-700 mb-6 flex justify-between items-center">
                                    <div className="text-center flex-1 border-r border-slate-200 dark:border-slate-700 pr-2">
                                        <p className="text-[9px] text-slate-500 dark:text-slate-400 uppercase font-bold tracking-wider mb-1">Peso Final</p>
                                        <p className="text-xl font-black text-slate-700 dark:text-white">{estimatedWeight.toFixed(0)} <span className="text-xs font-medium text-slate-400">gr</span></p>
                                    </div>
                                    <div className="text-center flex-1 pl-2">
                                        <p className="text-[9px] text-slate-500 dark:text-slate-400 uppercase font-bold tracking-wider mb-1">Total</p>
                                        <p className="text-xl font-black text-blue-600 dark:text-blue-400">${estimatedPrice.toFixed(2)}</p>
                                    </div>
                                </div>
                                <button type="submit" disabled={!value || parseFloat(value) <= 0} className="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl transition-all hover:scale-105 active:scale-95 disabled:opacity-50 disabled:scale-100 flex justify-center gap-2 shadow-lg shadow-blue-500/30 text-sm">
                                    AGREGAR AL CARRITO <i data-lucide="shopping-bag" className="w-4 h-4"></i>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            );
        };

        const POSView = ({ products, cart, addToCart, updateCartQuantity, removeFromCart, processSale, finalizeSale, user, session, sales, lastClose, services, onServiceAdd }) => {
            const [searchTerm, setSearchTerm] = useState("");
            const [selectedCategory, setSelectedCategory] = useState("Todos");
            const [weightModalProduct, setWeightModalProduct] = useState(null);
            const [showCashModal, setShowCashModal] = useState(false); 
            const [showCalculatorPanel, setShowCalculatorPanel] = useState(false); 
            const [showPriceChecker, setShowPriceChecker] = useState(false);
            const [serviceModalType, setServiceModalType] = useState(null); // 'SUBE' or 'VIRTUAL'
            const inputRef = useRef(null);

            // --- LÓGICA DE DRAGGABLE ---
            const [calcPos, setCalcPos] = useState({ x: window.innerWidth - 320, y: window.innerHeight - 450 });
            const [isDragging, setIsDragging] = useState(false);
            const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });

            const onDragStart = (e) => {
                setIsDragging(true);
                setDragOffset({ x: e.clientX - calcPos.x, y: e.clientY - calcPos.y });
            };

            const onDragMove = useCallback((e) => {
                if (!isDragging) return;
                setCalcPos({ x: e.clientX - dragOffset.x, y: e.clientY - dragOffset.y });
            }, [isDragging, dragOffset]);

            const onDragEnd = () => setIsDragging(false);

            useEffect(() => {
                if (isDragging) { window.addEventListener('mousemove', onDragMove); window.addEventListener('mouseup', onDragEnd); } 
                else { window.removeEventListener('mousemove', onDragMove); window.removeEventListener('mouseup', onDragEnd); }
                return () => { window.removeEventListener('mousemove', onDragMove); window.removeEventListener('mouseup', onDragEnd); };
            }, [isDragging, onDragMove]);

            const productsWithStock = useMemo(() => products.map(p => {
                if(p.es_combo) return { ...p, stock: calculateComboStock(p, products) };
                return p;
            }), [products]);
            
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (weightModalProduct || showCashModal || serviceModalType) return;

                    if (e.key === 'F4') { e.preventDefault(); setShowPriceChecker(true); return; }
                    if (showPriceChecker && e.key === 'Escape') { setShowPriceChecker(false); return; }

                    if (cart.length > 0 && !showPriceChecker) {
                        if (e.key === 'F1') { e.preventDefault(); initiateSale('EFECTIVO'); }
                        if (e.key === 'F2') { e.preventDefault(); initiateSale('MERCADOPAGO'); }
                        if (e.key === 'F3') { e.preventDefault(); initiateSale('DEBITO'); }
                        if (e.key === 'F5') { e.preventDefault(); finalizeSale('FIADO'); }
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [cart, weightModalProduct, showCashModal, showPriceChecker, serviceModalType]);

            const initiateSale = (method) => {
                const shouldShowCash = processSale(method);
                if (shouldShowCash) setShowCashModal(true);
            };

            const confirmCashSale = () => {
                finalizeSale('EFECTIVO');
                setShowCashModal(false);
            };

            const handleProductClick = (product) => {
                if (product.es_pesable) setWeightModalProduct(product);
                else addToCart(product);
            };

            const confirmWeight = (qty) => {
                addToCart(weightModalProduct, qty);
                setWeightModalProduct(null);
                setSearchTerm(""); 
            };

            const handleSearch = (e) => {
                if (e.key === 'Enter') {
                    const termClean = searchTerm.trim();
                    const exactMatch = productsWithStock.find(p => p.codigo === termClean);
                    if (exactMatch) { 
                        handleProductClick(exactMatch);
                        if (!exactMatch.es_pesable) setSearchTerm("");
                    }
                }
            };
            
            const handleConfirmService = (type, amount) => {
                onServiceAdd(type, amount);
                setServiceModalType(null);
            };

            const filteredProducts = productsWithStock.filter(p => {
                const termLower = searchTerm.trim().toLowerCase();
                const matchesSearch = p.nombre.toLowerCase().includes(termLower) || p.codigo.includes(termLower);
                const matchesCategory = selectedCategory === "Todos" || p.categoria === selectedCategory;
                return matchesSearch && matchesCategory;
            });
            
            const sessionSales = session ? sales.filter(s => s.sesion_id === session.id).reduce((acc, curr) => acc + curr.total, 0) : 0;
            const sessionServices = session ? services.filter(s => s.sesion_id === session.id).reduce((acc, curr) => acc + curr.monto, 0) : 0;
            const cajaTotal = (session ? session.saldo_inicial : 0) + sessionSales + sessionServices;
            const globalTotal = sales.filter(s => new Date(s.fecha).getTime() > lastClose).reduce((acc, curr) => acc + curr.total, 0);
            const cartTotal = cart.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);

            const getTheme = () => {
                if (user.id === 2) return { text: "text-blue-700 dark:text-blue-400", bg: "bg-gradient-to-r from-blue-600 to-blue-500", border: "border-blue-200" }; 
                if (user.id === 3) return { text: "text-green-700 dark:text-green-400", bg: "bg-gradient-to-r from-green-600 to-green-500", border: "border-green-200" }; 
                return { text: "text-slate-800 dark:text-white", bg: "bg-slate-800", border: "border-slate-200" };
            };
            const theme = getTheme();

            return (
                <div className="h-full flex gap-0 relative animate-in fade-in duration-500">
                    {weightModalProduct && <WeightModal product={weightModalProduct} onConfirm={confirmWeight} onCancel={() => setWeightModalProduct(null)} />}
                    {showCashModal && <CashModal total={cartTotal} onConfirm={confirmCashSale} onCancel={() => setShowCashModal(false)} />}
                    {showPriceChecker && <PriceCheckerModal isOpen={showPriceChecker} onClose={() => setShowPriceChecker(false)} products={productsWithStock} />}
                    {serviceModalType && <ServiceModal type={serviceModalType} onConfirm={handleConfirmService} onCancel={() => setServiceModalType(null)} />}

                    {showCalculatorPanel && (
                        <div className="fixed w-64 z-[100] animate-in slide-in-from-bottom-10 fade-in duration-300 shadow-2xl rounded-2xl" style={{ left: `${calcPos.x}px`, top: `${calcPos.y}px` }}>
                            <div className="bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl rounded-2xl calculator-shadow border border-white/20 dark:border-slate-700 overflow-hidden ring-1 ring-black/5">
                                <div onMouseDown={onDragStart} className={`bg-gradient-to-r from-slate-800 to-slate-900 p-2 flex justify-between items-center text-white border-b border-white/10 ${isDragging ? 'cursor-grabbing' : 'cursor-grab'}`}>
                                    <div className="flex items-center gap-2 pointer-events-none"><i data-lucide="calculator" className="w-3 h-3 text-blue-400"></i><span className="text-[10px] font-black uppercase tracking-widest">Calculadora</span></div>
                                    <button onMouseDown={(e) => e.stopPropagation()} onClick={() => setShowCalculatorPanel(false)} className="hover:bg-red-500/80 p-1 rounded-lg transition-colors"><i data-lucide="x" className="w-3 h-3"></i></button>
                                </div>
                                <div className="p-1"><Calculator isOpen={showCalculatorPanel} /></div>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 flex flex-col p-4 pr-2 overflow-hidden">
                        <div className="flex justify-between items-center mb-3">
                            <div><h1 className={`text-xl font-black tracking-tight transition-colors ${theme.text}`}>Hola, {user.alias || user.nombre}</h1></div>
                            <div className="flex gap-2">
                                <div className="bg-white/80 dark:bg-slate-800/80 backdrop-blur px-3 py-1.5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 text-right"><p className="text-[9px] text-slate-400 uppercase font-bold tracking-widest mb-0.5">Caja Turno</p><p className="text-lg font-black text-green-600 dark:text-green-400 font-mono">${cajaTotal.toLocaleString('es-AR')}</p></div>
                                <div className="bg-slate-900 dark:bg-slate-800 text-white px-3 py-1.5 rounded-xl shadow-lg shadow-slate-900/20 border border-slate-700 text-right"><p className="text-[9px] text-slate-400 uppercase font-bold tracking-widest mb-0.5">Total Kiosco</p><p className="text-lg font-black text-white font-mono">${globalTotal.toLocaleString('es-AR')}</p></div>
                            </div>
                        </div>

                        <div className="flex gap-1 overflow-x-auto pb-2 mb-1 category-scroll mask-fade-right">
                            <button onClick={() => setSelectedCategory("Todos")} className={`px-3 py-1.5 rounded-lg font-bold whitespace-nowrap text-xs transition-all duration-300 ${selectedCategory === "Todos" ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30 scale-105' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'}`}>Todos</button>
                            {CATEGORIAS.map(cat => (
                                <button key={cat} onClick={() => setSelectedCategory(cat)} className={`px-3 py-1.5 rounded-lg font-bold whitespace-nowrap text-xs transition-all duration-300 ${selectedCategory === cat ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/30 scale-105' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700'}`}>{cat}</button>
                            ))}
                        </div>
                        
                        <div className="grid grid-cols-2 gap-2 mb-3">
                            <button onClick={() => setServiceModalType('SUBE')} className="bg-gradient-to-br from-blue-50 to-blue-100 hover:from-blue-100 hover:to-blue-200 text-blue-700 dark:from-blue-900/20 dark:to-blue-900/40 dark:text-blue-200 dark:hover:from-blue-900/40 p-2.5 rounded-xl flex items-center justify-center gap-2 font-black shadow-sm border border-blue-200 dark:border-blue-800 transition-all hover:-translate-y-1 active:scale-95 group text-sm">
                                <div className="bg-white dark:bg-blue-500/20 p-1.5 rounded-full shadow-sm group-hover:scale-110 transition-transform"><i data-lucide="bus" className="w-4 h-4"></i></div> CARGA SUBE
                            </button>
                            <button onClick={() => setServiceModalType('VIRTUAL')} className="bg-gradient-to-br from-purple-50 to-purple-100 hover:from-purple-100 hover:to-purple-200 text-purple-700 dark:from-purple-900/20 dark:to-purple-900/40 dark:text-purple-200 dark:hover:from-purple-900/40 p-2.5 rounded-xl flex items-center justify-center gap-2 font-black shadow-sm border border-purple-200 dark:border-purple-800 transition-all hover:-translate-y-1 active:scale-95 group text-sm">
                                <div className="bg-white dark:bg-purple-500/20 p-1.5 rounded-full shadow-sm group-hover:scale-110 transition-transform"><i data-lucide="smartphone" className="w-4 h-4"></i></div> CARGA VIRTUAL
                            </button>
                        </div>

                        <div className="relative mb-3 flex-shrink-0 group">
                            <i data-lucide="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4 group-focus-within:text-blue-500 transition-colors"></i>
                            <input ref={inputRef} type="text" className="w-full pl-9 pr-2 py-2.5 rounded-xl shadow-sm border-2 border-white dark:border-slate-800 focus:border-blue-500 bg-white dark:bg-slate-800 dark:text-white text-sm outline-none barcode-input transition-all placeholder:text-slate-400 group-hover:shadow-md" placeholder="Escanear código o buscar..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} onKeyDown={handleSearch} autoFocus={window.innerWidth > 768} />
                            <div className="absolute right-2 top-2 px-1.5 py-0.5 bg-slate-100 dark:bg-slate-700 rounded text-[9px] text-slate-400 font-mono border border-slate-200 dark:border-slate-600">ENTER</div>
                        </div>
                        
                        <div className="flex-1 overflow-y-auto pr-1 pb-4">
                            <div className="grid grid-cols-2 lg:grid-cols-3 gap-2 content-start">
                                {filteredProducts.map(product => (
                                    <button key={product.id} onClick={() => handleProductClick(product)} className={`bg-white dark:bg-slate-800 p-2 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700/50 text-left transition-all duration-300 hover:shadow-lg hover:-translate-y-0.5 hover:border-blue-200 dark:hover:border-blue-900 relative group overflow-hidden ${product.stock <= 0 ? 'opacity-50 grayscale' : ''} ${product.es_combo ? 'ring-1 ring-yellow-400/50 dark:ring-yellow-600/50' : ''}`}>
                                                
                                        <div className="absolute inset-0 bg-gradient-to-br from-blue-50/0 to-blue-50/50 dark:from-blue-900/0 dark:to-blue-900/20 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                                        
                                        {product.stock <= product.stock_minimo && product.stock > 0 && <div className="absolute top-2 right-2 w-1.5 h-1.5 bg-red-500 rounded-full critical-stock shadow-[0_0_10px_rgba(239,68,68,0.5)]"></div>}
                                        {product.es_combo && <div className="absolute top-0 right-0 bg-yellow-400 text-yellow-900 text-[8px] font-bold px-2 py-0.5 rounded-bl-lg shadow-sm z-10">PROMO</div>}
                                        
                                        <div className="flex gap-2">
                                            <div className={`h-8 w-8 rounded-lg flex-shrink-0 flex items-center justify-center font-bold text-xs shadow-inner transition-transform group-hover:scale-105 relative z-10 ${product.es_combo ? 'bg-yellow-100 text-yellow-700 dark:bg-yellow-900/30 dark:text-yellow-300' : (product.es_pesable ? 'bg-purple-100 text-purple-600 dark:bg-purple-900/30 dark:text-purple-300' : 'bg-blue-50 text-blue-600 dark:bg-blue-900/30 dark:text-blue-300')}`}>
                                                {product.es_combo ? <i data-lucide="package" className="w-4 h-4"></i> : (product.es_pesable ? <i data-lucide="scale" className="w-4 h-4"></i> : product.nombre.substring(0,2).toUpperCase())}
                                            </div>
                                            <div className="relative z-10 min-w-0 flex-1">
                                                <h3 className="font-bold text-slate-700 dark:text-slate-200 leading-tight mb-0.5 truncate text-sm">{product.nombre}</h3>
                                                <p className="text-[10px] text-slate-400 mb-1 truncate font-mono bg-slate-50 dark:bg-slate-900/50 inline-block px-1 rounded">#{product.codigo}</p>
                                            </div>
                                        </div>
                                        <div className="flex justify-between items-end border-t border-slate-50 dark:border-slate-700 pt-2 mt-1">
                                            <span className="text-base font-black text-slate-800 dark:text-white">${product.precio}</span>
                                            <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${product.stock <= product.stock_minimo ? 'bg-red-100 text-red-700 dark:bg-red-900/50 dark:text-red-200' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}`}>
                                                {product.stock} {product.es_pesable ? 'kg' : 'un'}
                                            </span>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                    
                    <div className="w-80 bg-white dark:bg-slate-900/95 border-l border-slate-200 dark:border-slate-800 flex flex-col shadow-2xl z-20 transition-colors backdrop-blur-xl">
                        <div className={`p-4 border-b border-white/10 flex justify-between items-center transition-colors shadow-lg relative overflow-hidden ${theme.bg}`}>
                            <div className="absolute inset-0 opacity-10 bg-[url('https://grainy-gradients.vercel.app/noise.svg')]"></div>
                            <h2 className="font-bold text-md text-white flex items-center gap-2 relative z-10"><i data-lucide="shopping-cart" className="w-4 h-4 text-white/90"></i>Venta</h2>
                            <button onClick={() => setShowCalculatorPanel(!showCalculatorPanel)} className={`p-1.5 rounded-lg transition-all text-white hover:bg-white/20 relative z-10`} title="Calculadora"><i data-lucide="calculator" className="w-4 h-4"></i></button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-3 space-y-2 bg-slate-50 dark:bg-slate-950/50">
                            {cart.length === 0 ? <div className="h-full flex flex-col items-center justify-center text-slate-400 opacity-60 animate-in zoom-in duration-500"><i data-lucide="shopping-cart" className="w-16 h-16 mb-2 stroke-1"></i><p className="font-medium text-sm">Carrito vacío</p></div> : cart.map(item => (
                                <div key={item.id} className="group flex justify-between items-center bg-white dark:bg-slate-800 p-2 rounded-lg border border-slate-200 dark:border-slate-700 shadow-sm transition-all hover:shadow-md hover:border-blue-300 dark:hover:border-blue-700 animate-in slide-in-from-right-4 duration-300">
                                    <div className="flex-1 min-w-0">
                                        <div className="flex items-center gap-1">
                                            {item.es_combo && <span className="bg-yellow-400 text-yellow-900 text-[8px] px-1 py-0.5 rounded font-bold uppercase tracking-wide">Promo</span>}
                                            <p className="font-bold text-slate-700 dark:text-white text-xs truncate">{item.nombre}</p>
                                        </div>
                                        <div className="flex items-center gap-2 mt-1">
                                            {!item.es_pesable && (
                                                <div className="flex items-center bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-md shadow-inner overflow-hidden">
                                                    <button onClick={() => updateCartQuantity(item.id, -1)} className="px-2 py-0.5 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 font-bold transition-colors text-xs">-</button>
                                                    <span className="px-1 text-xs font-bold text-slate-800 dark:text-white w-5 text-center">{item.cantidad}</span>
                                                    <button onClick={() => updateCartQuantity(item.id, 1)} className="px-2 py-0.5 text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-blue-900/30 font-bold transition-colors text-xs">+</button>
                                                </div>
                                            )}
                                            {item.es_pesable && <p className="text-[10px] text-purple-600 dark:text-purple-400 font-bold bg-purple-50 dark:bg-purple-900/20 px-1.5 py-0.5 rounded">{(item.cantidad * 1000).toFixed(0)}gr</p>}
                                            <p className="text-[10px] text-slate-400 dark:text-slate-500">x ${item.precio}</p>
                                        </div>
                                    </div>
                                    <div className="flex flex-col items-end gap-1 ml-2">
                                        <span className="font-bold font-mono text-sm text-slate-800 dark:text-white">${(item.precio * item.cantidad).toFixed(0)}</span>
                                        <button onClick={() => removeFromCart(item.id)} className="text-slate-300 hover:text-red-500 transition-colors p-0.5 opacity-0 group-hover:opacity-100"><i data-lucide="trash-2" className="w-3 h-3"></i></button>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="p-4 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 shadow-[0_-10px_30px_rgba(0,0,0,0.05)] relative z-20">
                            <div className="flex justify-between items-end mb-4">
                                <span className="text-slate-500 dark:text-slate-400 font-medium text-xs uppercase tracking-widest">Total</span>
                                <span className="text-3xl font-black text-slate-900 dark:text-white tracking-tighter">${cartTotal.toLocaleString('es-AR')}</span>
                            </div>
                            <div className="grid grid-cols-1 gap-2">
                                <button onClick={() => initiateSale('EFECTIVO')} disabled={cart.length === 0} className="w-full py-3 bg-gradient-to-r from-green-600 to-green-500 hover:to-green-400 text-white rounded-xl font-black text-md flex items-center justify-center gap-2 transition-all shadow-lg shadow-green-600/30 transform hover:scale-[1.02] active:scale-95 disabled:opacity-50 disabled:shadow-none disabled:transform-none">
                                    <i data-lucide="dollar-sign" className="w-4 h-4"></i> COBRAR (F1)
                                </button>
                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={() => finalizeSale('MERCADOPAGO')} disabled={cart.length === 0} className="py-2 bg-blue-500 hover:bg-blue-600 text-white rounded-lg font-bold text-xs transition-all shadow-md shadow-blue-500/20 active:scale-95 disabled:opacity-50 flex items-center justify-center gap-1"><i data-lucide="qr-code" className="w-3 h-3"></i> MP/QR (F2)</button>
                                    <button onClick={() => finalizeSale('DEBITO')} disabled={cart.length === 0} className="py-2 bg-slate-700 hover:bg-slate-800 text-white rounded-lg font-bold text-xs transition-all shadow-md shadow-slate-700/20 active:scale-95 disabled:opacity-50 flex items-center justify-center gap-1"><i data-lucide="credit-card" className="w-3 h-3"></i> TARJETA (F3)</button>
                                </div>
                                <button onClick={() => finalizeSale('FIADO')} disabled={cart.length === 0} className="w-full py-2 bg-orange-500 hover:bg-orange-600 text-white rounded-lg font-bold text-xs transition-all shadow-md shadow-orange-500/30 active:scale-95 disabled:opacity-50 flex items-center justify-center gap-1">
                                    <i data-lucide="user-plus" className="w-3 h-3"></i> FIADO / DEUDA (F5)
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminView = ({ products, setProducts, expenses, addExpense, session, sales, lastClose, restoreSystem, services, notes }) => {
            const [tab, setTab] = useState('products'); 
            const [newProduct, setNewProduct] = useState({ id: null, codigo: '', nombre: '', categoria: 'Varios', precio: '', costo: '', stock: '', stock_minimo: 5, es_pesable: false, es_combo: false, componentes: [] });
            const [isEditing, setIsEditing] = useState(false);
            const [currentStock, setCurrentStock] = useState(0); 
            const [showCriticalOnly, setShowCriticalOnly] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [selectedComponentId, setSelectedComponentId] = useState("");
            const [selectedComponentQty, setSelectedComponentQty] = useState(1);
            const [expenseDesc, setExpenseDesc] = useState('');
            const [expenseAmount, setExpenseAmount] = useState('');
            const fileInputRef = useRef(null); // CORRECCION: Ref para input de archivo

            const AUTO_CATEGORIAS = {
                "Bebidas": ["coca", "pepsi", "sprite", "fanta", "7up", "manaos", "levite", "agua", "soda", "jugo", "cerveza", "vino", "fernet", "gancia", "frizze", "speed", "monster", "red bull", "powerade", "gatorade", "brahma", "quilmes", "stella", "andes", "corona", "heineken"],
                "Golosinas": ["alfajor", "chocolate", "caramelo", "chicle", "chupetin", "turron", "oblea", "gomitas", "confites", "pastillas", "milka", "cofler", "block", "shot", "aguila", "tofi", "bon o bon", "beldent", "halls", "topline", "bazooka", "flynn paff", "palitos"],
                "Cigarrillos": ["marlboro", "philip", "chesterfield", "lucky", "camel", "red point", "master", "pier", "dolchester", "parliament"],
                "Lácteos": ["leche", "yogurt", "yogur", "manteca", "crema de leche", "dulce de leche", "serenisima", "sancor", "ilolay"],
                "Fiambrería": ["jamon", "paleta", "bondiola", "salame", "mortadela", "queso", "cremoso", "muzarella", "muzzarella", "tybo", "dambo", "fiambrin", "salchichon"],
                "Limpieza": ["detergente", "lavandina", "jabon", "suavizante", "cif", "magistral", "ala", "ariel", "skip", "vivere", "poett", "glade", "lysoform", "trapo", "esponja", "virulana"],
                "Perfumería": ["shampoo", "acondicionador", "desodorante", "jabon de tocador", "dentifrico", "pasta dental", "cepillo", "papel higienico", "rollo de cocina", "pañales", "toallitas", "rexona", "axe", "dove", "sedal", "pantene", "plusbelle"],
                "Comestibles": ["yerba", "azucar", "harina", "fideos", "arroz", "aceite", "pure", "tomate", "galletitas", "bizcochos", "pan", "facturas", "sanguche", "sandwich", "paty", "hamburguesa", "salchichas", "mayonesa", "ketchup", "savora", "vinagre", "sal"],
                "Kiosco": ["encendedor", "pilas", "carga", "sube", "chip", "figuritas"],
                "Promos": ["promo", "combo", "oferta", "pack"]
            };

            const autoClassify = (name) => {
                const lower = name.toLowerCase();
                for (const [cat, keywords] of Object.entries(AUTO_CATEGORIAS)) {
                    if (keywords.some(k => lower.includes(k))) return cat;
                }
                return null;
            };

            const handleNameChange = (e) => {
                const val = e.target.value;
                let updates = { nombre: val };
                const sugerida = autoClassify(val);
                if (sugerida) updates.categoria = sugerida;
                setNewProduct(prev => ({ ...prev, ...updates }));
            };

            const handleCodeChange = (e) => {
                const code = e.target.value.trim();
                const existing = products.find(p => p.codigo === code);
                if (existing) {
                    setNewProduct({ ...existing, stock: '' });
                    setCurrentStock(existing.stock); 
                    setIsEditing(true);
                } else {
                    setNewProduct(prev => ({ ...prev, codigo: e.target.value, id: null, nombre: isEditing ? '' : prev.nombre, precio: isEditing ? '' : prev.precio, costo: isEditing ? '' : prev.costo, stock: isEditing ? '' : prev.costo, es_pesable: isEditing ? prev.es_pesable : false }));
                    setIsEditing(false);
                    setCurrentStock(0);
                }
            };

            // CORRECCION CRÍTICA: Lógica de guardado para evitar duplicados
            const handleSave = (e) => {
                e.preventDefault();
                if (isSaving) return;

                if (newProduct.es_combo && (!newProduct.componentes || newProduct.componentes.length === 0)) {
                    alert("Un combo debe tener al menos un producto componente.");
                    return;
                }

                setIsSaving(true);
                const cleanCode = newProduct.codigo.trim();
                const existingIndex = newProduct.id 
                    ? products.findIndex(p => p.id === newProduct.id) 
                    : products.findIndex(p => p.codigo === cleanCode);
                    
                const stockIngresado = newProduct.es_combo ? 0 : (parseFloat(newProduct.stock) || 0); 

                if (existingIndex >= 0) {
                    const prod = products[existingIndex];
                    if (prod.codigo !== cleanCode && products.some(p => p.codigo === cleanCode && p.id !== prod.id)) {
                        alert("¡Error! Ese código de barras ya pertenece a otro producto.");
                        setIsSaving(false);
                        return;
                    }

                    if (newProduct.es_combo || confirm(`Stock Actual: ${prod.stock}\nAgregarás: ${stockIngresado}\nNuevo Total: ${prod.stock + stockIngresado}\n\n¿Confirmar cambios?`)) {
                        const updatedProducts = [...products];
                        const nuevoStock = newProduct.es_combo ? 0 : parseFloat((prod.stock + stockIngresado).toFixed(3));
                        
                        updatedProducts[existingIndex] = { 
                            ...prod, 
                            ...newProduct, 
                            codigo: cleanCode, 
                            precio: parseFloat(newProduct.precio), 
                            costo: parseFloat(newProduct.costo), 
                            stock: nuevoStock, 
                            stock_minimo: parseFloat(newProduct.stock_minimo) 
                        };
                        setProducts(updatedProducts);
                        alert("Producto actualizado correctamente.");
                    }
                } else {
                    if (products.some(p => p.codigo === cleanCode)) {
                        alert("¡Error! Ya existe un producto con ese código.");
                        setIsSaving(false);
                        return;
                    }

                    const product = { 
                        id: generateUniqueId(), 
                        ...newProduct, 
                        codigo: cleanCode, 
                        precio: parseFloat(newProduct.precio), 
                        costo: parseFloat(newProduct.costo), 
                        stock: stockIngresado, 
                        stock_minimo: parseFloat(newProduct.stock_minimo) 
                    };
                    setProducts([...products, product]);
                    alert("Producto creado.");
                }
                setNewProduct({ id: null, codigo: '', nombre: '', categoria: 'Varios', precio: '', costo: '', stock: '', stock_minimo: 5, es_pesable: false, es_combo: false, componentes: [] });
                setIsEditing(false);
                setCurrentStock(0);
                setTimeout(() => setIsSaving(false), 500);
            };

            const addComponent = () => {
                if (!selectedComponentId) return;
                const prod = products.find(p => p.id === selectedComponentId);
                if (!prod) return;
                
                const existingComp = newProduct.componentes.find(c => c.id === selectedComponentId);
                let newComponents;
                if(existingComp) {
                    newComponents = newProduct.componentes.map(c => c.id === selectedComponentId ? { ...c, cantidad: c.cantidad + parseFloat(selectedComponentQty) } : c);
                } else {
                    newComponents = [...(newProduct.componentes || []), { id: selectedComponentId, nombre: prod.nombre, cantidad: parseFloat(selectedComponentQty) }];
                }
                setNewProduct({ ...newProduct, componentes: newComponents });
                setSelectedComponentId("");
                setSelectedComponentQty(1);
            };

            const removeComponent = (compId) => {
                setNewProduct({ ...newProduct, componentes: newProduct.componentes.filter(c => c.id !== compId) });
            };

            const deleteProduct = (id) => { if(confirm('¿Borrar?')) setProducts(products.filter(p => p.id !== id)); };

            const filteredProducts = products.filter(p => {
                if (showCriticalOnly && p.stock > p.stock_minimo) return false;
                const searchCode = newProduct.codigo.toString().trim().toLowerCase();
                const searchName = newProduct.nombre.toLowerCase();
                if (!searchCode && !searchName) return true;
                if (searchCode) return p.codigo.toString().toLowerCase().includes(searchCode);
                if (searchName) return p.nombre.toLowerCase().includes(searchName);
                return true;
            });

            const handleAddExpense = (e) => {
                e.preventDefault();
                if(!session) { alert("Debe haber una caja abierta para registrar gastos de ella."); return; }
                if(expenseDesc && expenseAmount) {
                    addExpense(expenseDesc, expenseAmount);
                    setExpenseDesc('');
                    setExpenseAmount('');
                    alert("Gasto registrado. Se descontará del cierre de caja.");
                }
            };

            const handleExport = () => {
                const data = { products, sales, expenses, lastClose, notes, backupDate: new Date().toISOString() };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `kiosco_backup_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            };

            const handleImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if(confirm(`Se importarán ${data.products?.length || 0} productos. ¡Esto reemplazará los datos actuales! ¿Seguro?`)) {
                            restoreSystem(data);
                        }
                    } catch (err) { alert("Error al leer archivo de respaldo."); }
                };
                reader.readAsText(file);
            };

            return (
                <div className="p-6 max-w-5xl mx-auto dark:text-slate-200 animate-in fade-in duration-500">
                    <div className="flex mb-6 border-b border-slate-300 dark:border-slate-700">
                        <button onClick={() => setTab('products')} className={`px-6 py-3 font-bold text-sm transition-all rounded-t-xl ${tab === 'products' ? 'bg-white dark:bg-slate-800 text-blue-600 dark:text-blue-400 border-b-2 border-blue-600 dark:border-blue-400 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-white/50'}`}>Inventario</button>
                        <button onClick={() => setTab('expenses')} className={`px-6 py-3 font-bold text-sm transition-all rounded-t-xl ${tab === 'expenses' ? 'bg-white dark:bg-slate-800 text-red-600 dark:text-red-400 border-b-2 border-red-600 dark:border-red-400 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-white/50'}`}>Caja y Gastos</button>
                        <button onClick={() => setTab('backup')} className={`px-6 py-3 font-bold text-sm transition-all rounded-t-xl ${tab === 'backup' ? 'bg-white dark:bg-slate-800 text-purple-600 dark:text-purple-400 border-b-2 border-purple-600 dark:border-purple-400 shadow-sm' : 'text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-white/50'}`}>Config. y Backup</button>
                    </div>

                    {tab === 'products' && (
                        <>
                            <div className="flex justify-between items-center mb-6 gap-4">
                                <h2 className="text-2xl font-black text-slate-800 dark:text-white tracking-tight">Gestión de Stock</h2>
                                <button onClick={() => setShowCriticalOnly(!showCriticalOnly)} className={`px-4 py-2 rounded-xl font-bold flex items-center gap-2 border transition-all shadow-sm hover:shadow-md text-sm ${showCriticalOnly ? 'bg-red-600 text-white dark:bg-red-700' : 'bg-white dark:bg-slate-800 text-red-600 dark:text-red-400 border-red-200 dark:border-red-900'}`}><i data-lucide="alert-triangle" className="w-4 h-4"></i>Stock Crítico</button>
                            </div>
                            <div className="bg-white dark:bg-slate-800 p-6 rounded-[1.5rem] shadow-lg shadow-slate-200/50 dark:shadow-none border border-slate-200 dark:border-slate-700 mb-6 sticky top-0 z-10 transition-colors">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold text-lg text-slate-700 dark:text-white flex items-center gap-2">
                                        <div className={`w-1.5 h-6 rounded-full ${isEditing ? 'bg-orange-500' : 'bg-blue-500'}`}></div>
                                        {isEditing ? 'Editar / Agregar Stock' : 'Nuevo Producto'}
                                    </h3>
                                    <label className="flex items-center gap-2 cursor-pointer bg-slate-100 dark:bg-slate-700 px-3 py-1.5 rounded-xl transition-colors hover:bg-slate-200 dark:hover:bg-slate-600">
                                        <input type="checkbox" checked={newProduct.es_combo} onChange={e => setNewProduct({...newProduct, es_combo: e.target.checked, categoria: e.target.checked ? 'Promos' : newProduct.categoria})} className="w-4 h-4 text-blue-600 rounded border-slate-300 focus:ring-blue-500" />
                                        <span className="font-bold text-xs text-slate-700 dark:text-slate-300">Es Combo / Promo</span>
                                    </label>
                                </div>
                                <form onSubmit={handleSave} className="grid grid-cols-6 gap-3">
                                    <input required placeholder="Código" value={newProduct.codigo} onChange={handleCodeChange} className="p-3 border-2 border-slate-200 dark:border-slate-700 rounded-xl col-span-1 font-mono text-sm font-bold bg-slate-50 dark:bg-slate-900 dark:text-white focus:border-blue-500 focus:ring-4 focus:ring-blue-100 dark:focus:ring-blue-900/30 outline-none transition-all" autoFocus />
                                    <input required placeholder="Nombre Promo/Producto" value={newProduct.nombre} onChange={handleNameChange} className="p-3 border-2 border-slate-200 dark:border-slate-700 rounded-xl col-span-2 bg-slate-50 dark:bg-slate-900 dark:text-white focus:border-blue-500 outline-none transition-all text-sm" />
                                    <select value={newProduct.categoria} onChange={e => setNewProduct({...newProduct, categoria: e.target.value})} className="p-3 border-2 border-slate-200 dark:border-slate-700 rounded-xl col-span-3 bg-slate-50 dark:bg-slate-900 dark:text-white focus:border-blue-500 outline-none transition-all text-sm">
                                        {CATEGORIAS.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                                    </select>
                                    {newProduct.es_combo ? (
                                        <div className="col-span-6 bg-yellow-50 dark:bg-yellow-900/10 p-4 rounded-xl border border-yellow-200 dark:border-yellow-900/30">
                                            <h4 className="text-xs font-bold text-yellow-800 dark:text-yellow-500 mb-3 uppercase tracking-wide flex items-center gap-2"><i data-lucide="package" className="w-4 h-4"></i> Configurar Componentes del Combo</h4>
                                            <div className="flex gap-2 mb-3">
                                                <select className="flex-1 p-2 border rounded-xl dark:bg-slate-800 dark:border-slate-600 text-sm" value={selectedComponentId} onChange={e => setSelectedComponentId(e.target.value)}>
                                                    <option value="">Seleccionar Producto...</option>
                                                    {products.filter(p => !p.es_combo).map(p => (
                                                        <option key={p.id} value={p.id}>{p.nombre} ({p.codigo})</option>
                                                    ))}
                                                </select>
                                                <input type="number" min="0.1" step="0.1" className="w-20 p-2 border rounded-xl dark:bg-slate-800 dark:border-slate-600 text-center font-bold text-sm" placeholder="Cant." value={selectedComponentQty} onChange={e => setSelectedComponentQty(e.target.value)} />
                                                <button type="button" onClick={addComponent} className="bg-yellow-500 hover:bg-yellow-600 text-white font-bold px-4 rounded-xl transition-all hover:scale-105 active:scale-95 shadow-md text-xs">Agregar</button>
                                            </div>
                                            <div className="space-y-1">
                                                {newProduct.componentes && newProduct.componentes.map(comp => (
                                                    <div key={comp.id} className="flex justify-between items-center bg-white dark:bg-slate-800 p-2 rounded-lg border border-slate-200 dark:border-slate-700 shadow-sm">
                                                        <span className="text-xs font-medium">{comp.nombre} <span className="text-slate-400">x</span> <span className="font-bold">{comp.cantidad}</span></span>
                                                        <button type="button" onClick={() => removeComponent(comp.id)} className="text-red-400 hover:text-red-600 p-1 hover:bg-red-50 dark:hover:bg-red-900/20 rounded transition"><i data-lucide="x" className="w-3 h-3"></i></button>
                                                    </div>
                                                ))}
                                                {(!newProduct.componentes || newProduct.componentes.length === 0) && <p className="text-xs text-slate-400 italic text-center py-2 border-2 border-dashed border-slate-200 rounded-lg">No hay componentes agregados.</p>}
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="col-span-6 grid grid-cols-6 gap-3">
                                            <div className="col-span-3 flex items-center gap-2 bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl border border-slate-200 dark:border-slate-700">
                                                <label className="flex items-center cursor-pointer relative"><input type="checkbox" checked={newProduct.es_pesable} onChange={e => setNewProduct({...newProduct, es_pesable: e.target.checked})} className="sr-only toggle-checkbox" /><div className="w-10 h-6 bg-slate-300 dark:bg-slate-600 rounded-full shadow-inner toggle-label transition-colors"></div><div className={`absolute w-4 h-4 bg-white rounded-full shadow inset-y-1 left-1 transition-transform ${newProduct.es_pesable ? 'translate-x-full bg-green-500' : ''}`}></div></label><span className={`text-xs font-bold uppercase tracking-wide ${newProduct.es_pesable ? 'text-green-600 dark:text-green-400' : 'text-slate-500 dark:text-slate-400'}`}>{newProduct.es_pesable ? 'SE VENDE POR PESO (KG)' : 'Venta por Unidad'}</span>
                                            </div>
                                            <input required type="number" placeholder="Costo" value={newProduct.costo} onChange={e => setNewProduct({...newProduct, costo: e.target.value})} className="p-3 border-2 border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-900 dark:text-white col-span-1 focus:border-blue-500 outline-none transition-all text-sm" />
                                            <input required type="number" step="0.001" placeholder={isEditing ? "Sumar Stock" : "Stock Inicial"} value={newProduct.stock} onChange={e => setNewProduct({...newProduct, stock: e.target.value})} className="p-3 border-2 border-slate-200 dark:border-slate-700 rounded-xl w-full bg-slate-50 dark:bg-slate-900 dark:text-white col-span-2 font-bold focus:border-blue-500 outline-none transition-all text-sm" required={!isEditing} />
                                        </div>
                                    )}
                                    <input required type="number" placeholder={newProduct.es_pesable ? "Precio x KG" : "Precio Venta"} value={newProduct.precio} onChange={e => setNewProduct({...newProduct, precio: e.target.value})} className="p-3 border-2 border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-900 dark:text-white col-span-3 font-bold text-md focus:border-blue-500 outline-none transition-all" />
                                    <input required type="number" step="0.001" placeholder="Stock Mínimo Alerta" value={newProduct.stock_minimo} onChange={e => setNewProduct({...newProduct, stock_minimo: e.target.value})} className="p-3 border-2 border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-900 dark:text-white col-span-3 focus:border-blue-500 outline-none transition-all text-sm" />
                                    <button type="submit" disabled={isSaving} className={`font-black p-3 rounded-xl col-span-6 text-white text-md shadow-lg hover:scale-[1.01] active:scale-95 transition-all ${isSaving ? 'bg-slate-400' : (isEditing ? 'bg-orange-500 hover:bg-orange-600 shadow-orange-500/30' : 'bg-blue-600 hover:bg-blue-700 shadow-blue-500/30')}`}>{isEditing ? 'ACTUALIZAR PRODUCTO' : 'AGREGAR NUEVO PRODUCTO'}</button>
                                </form>
                            </div>
                            <div className="bg-white dark:bg-slate-800 rounded-[1.5rem] shadow-lg shadow-slate-200/50 dark:shadow-none border border-slate-200 dark:border-slate-700 overflow-hidden">
                                <table className="w-full text-left">
                                    <thead className="bg-slate-50 dark:bg-slate-900/50 text-slate-500 dark:text-slate-400 uppercase text-[10px] font-bold border-b border-slate-200 dark:border-slate-700"><tr><th className="p-4">Código</th><th className="p-4">Producto</th><th className="p-4">Cat.</th><th className="p-4">Costo</th><th className="p-4">Precio</th><th className="p-4">Stock</th><th className="p-4">Acción</th></tr></thead>
                                    <tbody className="divide-y divide-slate-100 dark:divide-slate-700 text-sm">{filteredProducts.map(p => (
                                        <tr key={p.id} className={`hover:bg-slate-50 dark:hover:bg-slate-700/50 cursor-pointer transition-colors ${p.es_combo ? 'bg-yellow-50/30 dark:bg-yellow-900/5' : ''}`} onClick={() => { setNewProduct({...p, stock: ''}); setCurrentStock(p.stock); setIsEditing(true); window.scrollTo({ top: 0, behavior: 'smooth' }); }}>
                                            <td className="p-4 font-mono text-slate-500 dark:text-slate-400 text-xs">{p.codigo}</td>
                                            <td className="p-4 font-bold text-slate-800 dark:text-white flex items-center gap-2">{p.es_combo && <span className="text-[9px] bg-yellow-400 text-yellow-900 px-1.5 py-0.5 rounded font-bold uppercase">Promo</span>}{p.nombre}</td>
                                            <td className="p-4 text-slate-500 dark:text-slate-400 text-xs"><span className="bg-slate-100 dark:bg-slate-700 px-2 py-1 rounded-lg">{p.categoria || 'Varios'}</span></td>
                                            <td className="p-4 text-slate-500 dark:text-slate-400 text-xs">${p.costo}</td><td className="p-4 font-black text-slate-800 dark:text-white text-md">${p.precio}</td>
                                            <td className="p-4">{p.es_combo ? (<span className="px-2 py-1 rounded-full text-xs font-bold bg-slate-200 text-slate-700 dark:bg-slate-700 dark:text-slate-300">AUTO</span>) : (<span className={`px-2 py-1 rounded-full text-xs font-bold ${p.stock <= p.stock_minimo ? 'bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-200 border border-red-200 dark:border-red-800' : 'bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-200 border border-green-200 dark:border-green-800'}`}>{p.stock} {p.es_pesable ? 'kg' : 'un'}</span>)}</td>
                                            <td className="p-4"><button onClick={(e) => { e.stopPropagation(); deleteProduct(p.id); }} className="text-slate-300 hover:text-red-500 dark:hover:text-red-400 transition-colors p-1.5 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg"><i data-lucide="trash-2" className="w-4 h-4"></i></button></td>
                                        </tr>
                                    ))}</tbody>
                                </table>
                            </div>
                        </>
                    )}

                    {tab === 'expenses' && (
                        <>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                <div><h2 className="text-2xl font-black text-slate-800 dark:text-white mb-4 tracking-tight">Registrar Salida</h2><div className="bg-white dark:bg-slate-800 p-6 rounded-[2rem] shadow-lg border border-slate-200 dark:border-slate-700"><form onSubmit={handleAddExpense} className="space-y-4"><div><label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-2 uppercase tracking-wide">Descripción</label><input type="text" required placeholder="Ej: Pago Proveedor Coca-Cola" className="w-full p-3 border-2 border-slate-200 dark:border-slate-700 rounded-xl bg-slate-50 dark:bg-slate-900 dark:text-white focus:border-red-500 outline-none transition-all text-sm" value={expenseDesc} onChange={e => setExpenseDesc(e.target.value)} /></div><div><label className="block text-xs font-bold text-slate-700 dark:text-slate-300 mb-2 uppercase tracking-wide">Monto ($)</label><input type="number" required placeholder="0.00" className="w-full p-3 border-2 border-slate-200 dark:border-slate-700 rounded-xl font-mono font-bold text-lg bg-slate-50 dark:bg-slate-900 dark:text-white focus:border-red-500 outline-none transition-all" value={expenseAmount} onChange={e => setExpenseAmount(e.target.value)} /></div><button type="submit" className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-red-600/30 hover:scale-[1.02] active:scale-95 transition-all text-sm">REGISTRAR RETIRO <i data-lucide="minus-circle" className="w-4 h-4"></i></button></form><div className="mt-4 p-3 bg-yellow-50 dark:bg-yellow-900/20 rounded-xl text-xs text-yellow-800 dark:text-yellow-200 border border-yellow-200 dark:border-yellow-900/30 flex gap-2"><i data-lucide="info" className="inline w-4 h-4 flex-shrink-0"></i><p>Este monto se descontará del saldo esperado al momento de cerrar la caja.</p></div></div></div>
                                <div><h2 className="text-2xl font-black text-slate-800 dark:text-white mb-4 tracking-tight">Últimos Movimientos</h2><div className="bg-white dark:bg-slate-800 rounded-[2rem] shadow-lg border border-slate-200 dark:border-slate-700 overflow-hidden"><table className="w-full text-left"><thead className="bg-slate-50 dark:bg-slate-900 text-slate-500 dark:text-slate-400 uppercase text-[10px] font-bold border-b border-slate-100 dark:border-slate-700"><tr><th className="p-4">Fecha</th><th className="p-4">Detalle</th><th className="p-4 text-right">Monto</th></tr></thead><tbody className="divide-y divide-slate-100 dark:divide-slate-700 text-sm">{expenses.slice().reverse().slice(0, 10).map(exp => (<tr key={exp.id} className="hover:bg-slate-50 dark:hover:bg-slate-700/30 transition-colors"><td className="p-4 text-xs text-slate-400 dark:text-slate-500">{new Date(exp.fecha).toLocaleDateString()}</td><td className="p-4 font-medium text-slate-800 dark:text-white">{exp.descripcion} <span className="text-xs bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded text-slate-500 ml-2">({exp.usuario})</span></td><td className="p-4 text-right font-black text-red-600 dark:text-red-400">-${exp.monto}</td></tr>))}{expenses.length === 0 && <tr><td colSpan="3" className="p-8 text-center text-slate-400 dark:text-slate-500 italic">No hay gastos registrados.</td></tr>}</tbody></table></div></div>
                            </div>
                        </>
                    )}

                    {tab === 'backup' && (
                        <div className="max-w-2xl mx-auto animate-in fade-in slide-in-from-bottom-4 duration-500">
                            <h2 className="text-3xl font-black text-slate-800 dark:text-white mb-6 text-center tracking-tight">Seguridad y Respaldo</h2>
                            
                            {/* Exportar Backup */}
                            <div className="bg-white dark:bg-slate-800 p-8 rounded-[2rem] shadow-xl border border-slate-200 dark:border-slate-700 mb-6 text-center hover:shadow-2xl transition-shadow">
                                <div className="w-16 h-16 bg-blue-50 dark:bg-blue-900/20 text-blue-600 dark:text-blue-400 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner animate-float"><i data-lucide="save" className="w-8 h-8 stroke-1"></i></div>
                                <h3 className="text-xl font-bold text-slate-800 dark:text-white mb-2">Copia de Seguridad (Backup)</h3>
                                <p className="text-slate-500 dark:text-slate-400 mb-6 max-w-md mx-auto text-sm">Descarga un archivo JSON con todo tu inventario, ventas y configuración. Guardalo en un pendrive o en la nube.</p>
                                <button onClick={handleExport} className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-2xl shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 mx-auto transition-all transform hover:scale-105 active:scale-95 text-sm"><i data-lucide="download" className="w-4 h-4"></i> DESCARGAR COPIA AHORA</button>
                            </div>

                            {/* Importar Backup (Restaurar) */}
                            <div className="bg-white dark:bg-slate-800 p-8 rounded-[2rem] shadow-xl border border-slate-200 dark:border-slate-700 text-center hover:shadow-2xl transition-shadow border-dashed border-2">
                                <div className="w-16 h-16 bg-purple-50 dark:bg-purple-900/20 text-purple-600 dark:text-purple-400 rounded-full flex items-center justify-center mx-auto mb-4 shadow-inner"><i data-lucide="upload-cloud" className="w-8 h-8 stroke-1"></i></div>
                                <h3 className="text-xl font-bold text-slate-800 dark:text-white mb-2">Restaurar Sistema</h3>
                                <p className="text-slate-500 dark:text-slate-400 mb-6 max-w-md mx-auto text-sm">Importa un archivo de respaldo (.json) para recuperar tus productos y ventas. <b>¡Cuidado! Esto reemplazará los datos actuales.</b></p>
                                <div className="inline-block">
                                    <input 
                                        type="file" 
                                        accept=".json" 
                                        ref={fileInputRef}
                                        onChange={handleImport} 
                                        className="hidden" 
                                    />
                                    <button 
                                        onClick={() => fileInputRef.current.click()} 
                                        className="bg-slate-800 hover:bg-slate-900 dark:bg-white dark:text-slate-900 dark:hover:bg-slate-200 text-white font-bold py-4 px-8 rounded-2xl shadow-lg flex items-center justify-center gap-2 transition-all transform hover:scale-105 active:scale-95 text-sm"
                                    >
                                        <i data-lucide="upload" className="w-4 h-4"></i> SELECCIONAR ARCHIVO DE RESPALDO
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const VentasView = ({ sales, services }) => {
            const [filterSeller, setFilterSeller] = useState("");
            const [filterType, setFilterType] = useState(""); 
            const [selectedSale, setSelectedSale] = useState(null);

            const allTransactions = useMemo(() => {
                const safeSales = Array.isArray(sales) ? sales : [];
                const safeServices = Array.isArray(services) ? services : [];

                const normalizedSales = safeSales.map(s => ({
                    ...s,
                    tipoRegistro: 'VENTA',
                    vendedor: s.vendedor || "Desconocido"
                }));

                const normalizedServices = safeServices.map(s => ({
                    ...s,
                    total: s.monto, 
                    tipoRegistro: 'SERVICIO',
                    items: [], 
                    metodo: 'SISTEMA' 
                }));

                return [...normalizedSales, ...normalizedServices].sort((a, b) => {
                     const dateA = new Date(a.fecha).getTime() || 0;
                     const dateB = new Date(b.fecha).getTime() || 0;
                     return dateB - dateA;
                });
            }, [sales, services]);

            const sellers = [...new Set(allTransactions.map(t => t.vendedor))];

            const filteredList = allTransactions.filter(t => {
                const matchesSeller = filterSeller === "" || t.vendedor === filterSeller;
                
                let matchesSearch = true;
                if (filterType !== "") {
                    const searchLower = filterType.toLowerCase();
                    if (t.tipoRegistro === 'VENTA') {
                        matchesSearch = t.items.some(item => item.nombre.toLowerCase().includes(searchLower)) || (t.metodo && t.metodo.toLowerCase().includes(searchLower)) || (t.cliente && t.cliente.toLowerCase().includes(searchLower));
                    } else {
                        matchesSearch = t.tipo.toLowerCase().includes(searchLower);
                    }
                }
                
                return matchesSeller && matchesSearch;
            });
            
            useEffect(() => { if(selectedSale) lucide.createIcons(); }, [selectedSale]);
            useEffect(() => { lucide.createIcons(); }, [filteredList]);

            return (
                <div className="p-6 max-w-4xl mx-auto dark:text-slate-200 animate-in fade-in duration-500">
                    {selectedSale && <TicketModal sale={selectedSale} onClose={() => setSelectedSale(null)} />}
                    <h2 className="text-3xl font-black text-slate-800 dark:text-white mb-6 tracking-tight">Historial de Movimientos</h2>
                    <div className="flex gap-3 mb-6 flex-wrap">
                        <div className="relative">
                            <i data-lucide="user" className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i>
                            <select className="pl-10 pr-4 py-3 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 dark:text-white shadow-sm focus:outline-none focus:border-blue-500 font-bold appearance-none cursor-pointer text-sm" value={filterSeller} onChange={e => setFilterSeller(e.target.value)}>
                                <option value="">Todos los Vendedores</option>
                                {sellers.map(s => <option key={s} value={s}>{s}</option>)}
                            </select>
                        </div>
                        <div className="relative flex-1">
                            <i data-lucide="search" className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-4 h-4"></i>
                            <input type="text" placeholder="Buscar por producto, método (Fiado, QR) o cliente..." className="w-full pl-10 pr-4 py-3 rounded-xl border-2 border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 dark:text-white shadow-sm focus:outline-none focus:border-blue-500 font-medium text-sm" value={filterType} onChange={e => setFilterType(e.target.value)} />
                        </div>
                    </div>
                    <div className="space-y-3">
                        {filteredList.map(item => (
                            <div key={`${item.tipoRegistro}-${item.id}`} className={`bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex justify-between items-center transition-all hover:shadow-md hover:border-blue-300 dark:hover:border-blue-700 group ${item.tipoRegistro === 'SERVICIO' ? 'border-l-4 border-l-purple-500' : (item.metodo === 'FIADO' ? 'border-l-4 border-l-orange-500' : '')}`}>
                                <div className="flex items-center gap-4">
                                    <div className={`w-10 h-10 rounded-lg flex items-center justify-center font-black text-lg shadow-inner ${
                                        item.tipoRegistro === 'SERVICIO' 
                                            ? (item.tipo === 'SUBE' ? 'bg-blue-100 text-blue-600 dark:bg-blue-900/30' : 'bg-purple-100 text-purple-600 dark:bg-purple-900/30')
                                            : (item.metodo === 'EFECTIVO' ? 'bg-green-100 text-green-600 dark:bg-green-900/30' : (item.metodo === 'FIADO' ? 'bg-orange-100 text-orange-600 dark:bg-orange-900/30' : 'bg-blue-100 text-blue-600 dark:bg-blue-900/30'))
                                    }`}>
                                            {item.tipoRegistro === 'SERVICIO' 
                                                ? (item.tipo === 'SUBE' ? <i data-lucide="bus" className="w-5 h-5"></i> : <i data-lucide="smartphone" className="w-5 h-5"></i>)
                                                : (item.metodo === 'EFECTIVO' ? '$' : (item.metodo === 'FIADO' ? <i data-lucide="user-minus" className="w-5 h-5"></i> : 'QR'))
                                            }
                                    </div>
                                    
                                    <div>
                                        <div className="flex items-center gap-2 mb-0.5">
                                            <p className="text-xs text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider">{new Date(item.fecha).toLocaleString()}</p>
                                            <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${item.metodo === 'FIADO' ? 'bg-orange-500 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-500'}`}>{item.metodo || `CARGA ${item.tipo}`}</span>
                                        </div>
                                        <p className="font-bold text-sm text-slate-800 dark:text-white flex items-center gap-2">
                                            <i data-lucide="user-circle" className="w-3 h-3 text-slate-400"></i> {item.vendedor}
                                            {item.cliente && <span className="text-slate-400 font-normal">→ Para: <span className="font-black text-slate-700 dark:text-slate-300">{item.cliente}</span></span>}
                                        </p>
                                    </div>
                                </div>
                                <div className="flex items-center gap-6">
                                    <div className="text-right">
                                        <p className="text-xl font-black text-slate-800 dark:text-white tracking-tight">${item.total.toLocaleString('es-AR')}</p>
                                        <p className="text-[10px] text-slate-400 font-bold bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded-full inline-block mt-0.5">{item.tipoRegistro === 'VENTA' ? `${item.items.length} productos` : 'Servicio Digital'}</p>
                                    </div>
                                    
                                    {item.tipoRegistro === 'VENTA' ? (
                                        <button onClick={() => setSelectedSale(item)} className="p-2 bg-slate-100 hover:bg-blue-500 hover:text-white dark:bg-slate-700 dark:hover:bg-blue-600 rounded-lg transition-all shadow-sm group-hover:scale-110" title="Ver Detalle">
                                            <i data-lucide="chevron-right" className="w-5 h-5"></i>
                                        </button>
                                    ) : (
                                        <div className="w-10 h-10"></div>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
